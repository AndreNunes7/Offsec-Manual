<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OffSec Manual</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2307080b'/%3E%3Ctext x='6' y='22' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='16' font-weight='700' fill='%2337cdbd'%3E%3E_%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   RESET
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
ul { list-style: none; margin: 0; padding: 0; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

/* ============================================================
   TOKENS
   ============================================================ */
:root {
  /* ground — near-black terminal, cool undertone (Console direction) */
  --ink: #07080b;
  --panel: #0d0f15;
  --panel-2: #12151d;
  --inset: #070809;
  --line: #1a1e27;
  --line-soft: #14171f;
  --line-strong: #272d38;
  --ash: #9197a4;
  --ash-dim: #626976;
  --paper: #d9dce3;

  /* accent — phosphor teal; the only interactive accent, used with intent */
  --signal: #37cdbd;
  --signal-bright: #7ff0e2;
  --signal-wash: rgba(55, 205, 189, .13);

  /* semantic, independent from the accent */
  --go: #8fd694;
  --go-wash: rgba(143, 214, 148, .15);
  --stop: #ff6b6b;

  --radius: 8px;
  --radius-sm: 6px;
  --radius-lg: 12px;

  /* largura máxima do conteúdo — telas mais esticadas (v13) pra dar espaço a comandos,
     tabelas e blocos de resultado; a prosa continua limitada por max-width próprio. */
  --content-max: 1200px;

  /* spacing scale — one rhythm for the whole app (replaces ad-hoc margins) */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 36px;

  /* depth — deliberately shallow; a hairline lift, never a glow */
  --shadow-card: 0 1px 2px rgba(0,0,0,.25);
  --shadow-pop: 0 12px 32px rgba(0,0,0,.45);

  /* domain identity colors — categorical, not semantic */
  --dom-general: #8a92a6;
  --dom-ad: #b98fd4;
  --dom-web: #6fa8d9;
  --dom-linux: #5fab93;
  --dom-api: #c9926f;

  /* finding severity identity colors — categorical (like --dom-*), not the interactive accent */
  --sev-critical: #ff5c5c;
  --sev-high: #ff9d4d;
  --sev-medium: #f0c14b;
  --sev-low: #6fa8d9;
  --sev-info: #9197a4;

  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, "Liberation Mono", Menlo, monospace;
}

/* ============================================================
   BASE
   ============================================================ */
html { color-scheme: dark; }
body {
  background: var(--ink);
  color: var(--paper);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p { margin: 0; }
::selection { background: var(--signal-wash); color: var(--paper); }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
kbd {
  font-family: var(--font-mono);
  font-size: 10.5px;
  background: var(--inset);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 2px 6px;
  color: var(--ash);
}
@media (prefers-reduced-motion: reduce) { * { transition-duration: .001ms !important; animation-duration: .001ms !important; } }

/* ============================================================
   APP SHELL
   ============================================================ */
#app { display: flex; min-height: 100vh; }

.sidebar-toggle {
  display: none;
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 40;
  width: 40px;
  height: 40px;
  background: var(--panel);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sidebar-toggle span { display: block; width: 16px; height: 2px; background: var(--paper); border-radius: 1px; }
.sidebar-overlay { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30; }
.sidebar-overlay[hidden] { display: none; }

/* ============================================================
   SIDEBAR (fases) — trilha sequencial da operação
   ============================================================ */
.sidebar {
  width: 258px;
  flex-shrink: 0;
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  height: 100vh;
  position: sticky;
  top: 0;
}
.brand { display: block; padding: 20px 18px 4px; font-family: var(--font-mono); font-size: 15px; font-weight: 700; letter-spacing: -.01em; color: var(--paper); }
.brand:hover { color: var(--signal); }
.brand-accent { color: var(--signal); }
.brand-cursor { color: var(--signal); animation: brand-blink 1s step-end infinite; }
@keyframes brand-blink { 50% { opacity: 0; } }
.brand-sub { padding: 2px 18px 16px; font-size: 10px; color: var(--ash-dim); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .12em; }

.phase-nav { padding: 6px 10px; flex: 1; overflow-y: auto; }
.phase-nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 12px 10px;
  border-radius: var(--radius-sm);
  border-left: 2px solid transparent;
  text-align: left;
  margin-bottom: 2px;
}
.phase-nav-item:hover { background: var(--panel-2); }
.phase-nav-item.is-active { background: var(--panel-2); border-left-color: var(--signal); }
.phase-nav-item.is-active .phase-nav-label { color: var(--paper); }
.phase-nav-index { font-family: var(--font-mono); font-size: 12px; color: var(--ash-dim); width: 18px; flex-shrink: 0; }
.phase-nav-item.is-active .phase-nav-index { color: var(--signal); }
.phase-nav-label { font-size: 14px; font-weight: 600; color: var(--ash); flex: 1; }
.phase-nav-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); flex-shrink: 0; }
.phase-nav-item.has-progress .phase-nav-dot { background: var(--signal); }
.phase-nav-item.is-complete .phase-nav-dot { background: var(--go); }

/* ---- stepper: lista plana estilo command-palette (Console) ---- */
.phase-nav { position: relative; }
.phase-nav-item { position: relative; z-index: 1; padding: 10px 10px; }
.phase-nav-index {
  display: flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--panel); border: 1.5px solid var(--line-strong);
  font-size: 10.5px; color: var(--ash-dim);
}
.phase-nav-item.is-active .phase-nav-index { border-color: var(--signal); color: var(--signal); background: var(--signal-wash); }
.phase-nav-item.is-complete .phase-nav-index { border-color: var(--go); color: var(--go); }
.phase-nav-item.has-progress .phase-nav-index { border-color: var(--signal); color: var(--signal); }
.phase-nav-item.is-locked { opacity: .5; }
.phase-nav-item.is-locked .phase-nav-label { color: var(--ash-dim); }
.stepper-empty { padding: 14px 18px; font-size: 12.5px; color: var(--ash-dim); }

/* ---- Console: módulos da fase ativa (sub-links tipo command-palette) ---- */
.phase-nav-subs { margin: 2px 0 6px 30px; display: flex; flex-direction: column; gap: 1px; border-left: 1px solid var(--line); padding-left: 8px; }
.phase-nav-sub { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius-sm); text-decoration: none; color: var(--ash-dim); }
.phase-nav-sub:hover { background: var(--panel-2); color: var(--paper); }
.pns-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--chip-color, var(--dom-general)); flex-shrink: 0; }
.pns-label { flex: 1; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pns-count { font-family: var(--font-mono); font-size: 10px; color: var(--ash-dim); }
.phase-nav-sub.is-done .pns-count { color: var(--go); }

/* ---- indicador de escopo na sidebar ---- */
.scope-mini {
  margin: 4px 12px 10px; padding: 9px 12px;
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  display: flex; flex-direction: column; gap: 1px; text-align: left; position: relative;
}
.scope-mini[hidden] { display: none; }
.scope-mini:hover { border-color: var(--signal); }
.scope-mini-eyebrow { font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ash-dim); }
.scope-mini-label { font-size: 13px; font-weight: 700; color: var(--paper); }
.scope-mini-action { position: absolute; top: 9px; right: 12px; font-size: 10.5px; color: var(--signal); }

.sidebar-divider { height: 1px; background: var(--line); margin: var(--s-2) 18px var(--s-3); }
.util-section-label { font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--ash-dim); padding: 0 18px; margin: var(--s-3) 0 2px; }
.util-section-label:first-of-type { margin-top: 0; }
/* v15: navegação global — seção dedicada no topo da sidebar */
.sidebar-nav { padding: 8px 10px 4px; display: flex; flex-direction: column; gap: 1px; }
.util-link { display: block; padding: 8px 12px 8px 16px; font-size: 13px; color: var(--ash); border-left: 2px solid transparent; border-radius: var(--radius-sm); transition: color .12s ease, background .12s ease, border-color .12s ease; }
.util-link:hover { color: var(--paper); background: var(--panel-2); }
.util-link.is-active { color: var(--paper); background: var(--panel-2); border-left-color: var(--signal); }

.engagement-mini {
  margin: var(--s-3) var(--s-2) var(--s-2);
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  color: var(--ash-dim);
  display: flex;
  align-items: center;
  gap: 10px;
}
.engagement-mini:hover { border-color: var(--line-strong); color: var(--ash); }
.engagement-mini-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ash); }
.progress-ring {
  --pct: 0;
  flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
  background: conic-gradient(var(--signal) calc(var(--pct) * 1%), var(--line-soft) 0);
  display: flex; align-items: center; justify-content: center;
}
.progress-ring.is-complete { background: conic-gradient(var(--go) calc(var(--pct) * 1%), var(--line-soft) 0); }
.progress-ring-pct {
  width: 22px; height: 22px; border-radius: 50%; background: var(--panel);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 8.5px; font-weight: 700; color: var(--paper);
}

/* ============================================================
   MAIN
   ============================================================ */
main#main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.content-inner { max-width: var(--content-max); margin: 0 auto; width: 100%; padding: var(--s-5) 34px 88px; }

/* ---- session bar: variáveis do engajamento + busca ---- */
.session-bar {
  position: sticky; top: 0; z-index: 20;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  padding: 16px 32px;
}
.session-row { max-width: var(--content-max); margin: 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.var-cell { display: flex; flex-direction: column; gap: 6px; }
.var-cell label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ash-dim); }
.var-cell input {
  background: var(--inset); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 9px 11px; font-size: 13.5px; font-family: var(--font-mono); color: var(--paper); width: 128px;
}
.var-cell input::placeholder { color: var(--ash-dim); }
.var-cell input:focus { outline: none; border-color: var(--signal); }
.var-cell.is-filled input { border-color: color-mix(in srgb, var(--signal) 55%, var(--line)); background: color-mix(in srgb, var(--signal) 5%, var(--inset)); }
.var-cell.primary input { width: 210px; font-size: 14.5px; padding: 10px 12px; }
.session-spacer { flex: 1; }
/* barra recolhida (padrão): chip discreto com a variável primária */
.vars-collapsed { display: inline-flex; align-items: baseline; gap: 8px; max-width: 100%; padding: 8px 13px; background: var(--inset); border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
.vars-collapsed:hover { border-color: var(--line-strong); }
.vars-collapsed.is-filled { border-color: color-mix(in srgb, var(--signal) 45%, var(--line)); }
.vars-collapsed-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--ash-dim); flex-shrink: 0; }
.vars-collapsed-value { font-family: var(--font-mono); font-size: 13px; color: var(--paper); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vars-collapsed:not(.is-filled) .vars-collapsed-value { color: var(--ash-dim); }
.vars-collapsed-hint { font-size: 11px; color: var(--signal); flex-shrink: 0; margin-left: 2px; }
.vars-toggle { align-self: center; padding: 8px 12px; font-size: 12px; color: var(--ash); border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--panel); }
.vars-toggle:hover { color: var(--signal); border-color: var(--signal); }
.search-trigger {
  padding: 10px 14px;
  background: var(--inset);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  display: flex; align-items: center; gap: 10px;
  color: var(--ash); font-size: 13px;
  align-self: center;
}
.search-trigger:hover { border-color: var(--line-strong); color: var(--paper); }

/* ---- phase header ---- */
.phase-header { margin-bottom: var(--s-3); }
.phase-eyebrow { font-family: var(--font-mono); font-size: 10.5px; color: var(--signal); margin-bottom: var(--s-2); text-transform: uppercase; letter-spacing: .08em; }
.phase-title { font-size: 20px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.phase-desc { color: var(--ash); margin-top: var(--s-2); font-size: 13px; line-height: 1.6; max-width: 74ch; }

/* ---- domain filter ---- */
.domain-filter-row { display: flex; gap: 8px; margin: var(--s-5) 0 var(--s-4); flex-wrap: wrap; }
.domain-chip {
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--line);
  color: var(--ash);
  background: var(--panel);
}
.domain-chip:hover { border-color: var(--line-strong); }
.domain-chip.is-active { background: color-mix(in srgb, var(--chip-color, var(--signal)) 18%, var(--panel)); border-color: var(--chip-color, var(--signal)); color: var(--chip-color, var(--signal)); }

/* ---- toolbar da fase: copiar tudo / ocultar concluídos ---- */
.phase-toolbar { display: flex; gap: 8px; margin: 16px 0 4px; flex-wrap: wrap; }
.phase-tool { font-size: 12px; color: var(--ash); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 7px 12px; }
.phase-tool:hover { color: var(--signal); border-color: var(--signal); }
.phase-tool.is-active { color: var(--signal); border-color: color-mix(in srgb, var(--signal) 55%, var(--line)); background: var(--signal-wash); }

/* ============================================================
   STEP LIST — checklist sempre visível; referência atrás de "Detalhes"
   ============================================================ */
.step-list { display: flex; flex-direction: column; gap: var(--s-4); }
.step-card { border: 1px solid var(--line-soft); border-radius: var(--radius-lg); background: var(--panel); padding: var(--s-5) 24px; box-shadow: var(--shadow-card); }
.step-card-head { display: flex; align-items: flex-start; gap: var(--s-3); }
.step-domain-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--chip-color, var(--dom-general)); flex-shrink: 0; margin-top: 6px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--chip-color, var(--dom-general)) 14%, transparent); }
.step-head-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.step-title { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.step-summary { font-size: 12.5px; color: var(--ash); line-height: 1.5; }
.step-progress-badge { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--ash-dim); flex-shrink: 0; white-space: nowrap; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--inset); }
.step-progress-badge.is-done { color: var(--go); border-color: color-mix(in srgb, var(--go) 45%, var(--line)); background: var(--go-wash); }
.step-progress-badge.is-partial { color: var(--signal); border-color: color-mix(in srgb, var(--signal) 45%, var(--line)); background: var(--signal-wash); }

/* ---- Console: duas colunas por módulo (comando-herói | trilho de checklist) ---- */
.step-cols { display: grid; grid-template-columns: 1fr 300px; gap: var(--s-5); margin-top: var(--s-4); align-items: start; }
.step-cols.no-rail { grid-template-columns: 1fr; }
.step-main { min-width: 0; }
.step-rail { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow-y: auto; overscroll-behavior: contain; background: var(--inset); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s-3) var(--s-4) var(--s-4); }
.step-rail::-webkit-scrollbar { width: 8px; }
.step-rail::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 999px; border: 2px solid var(--inset); }
.step-rail::-webkit-scrollbar-thumb:hover { background: var(--ash-dim); }
.step-rail { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
/* cabeçalho do trilho fica fixo enquanto os itens rolam */
.step-rail-head, .step-rail-prog { position: sticky; z-index: 1; background: var(--inset); }
.step-rail-head { top: 0; padding-top: 2px; }
.step-rail-prog { top: 30px; margin-bottom: var(--s-3); }
.step-rail-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--s-2); }
.step-rail-title { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: var(--ash-dim); }
.step-rail-count { font-family: var(--font-mono); font-size: 20px; font-weight: 700; color: var(--ash); }
.step-rail-count small { font-size: 12px; color: var(--ash-dim); font-weight: 500; }
.step-rail-count.is-done { color: var(--go); }
.step-rail-count.is-partial { color: var(--signal); }
.step-rail-prog { height: 3px; border-radius: 999px; background: var(--panel-2); overflow: hidden; margin-bottom: var(--s-2); }
.step-rail-prog span { display: block; height: 100%; background: linear-gradient(90deg, var(--go), var(--signal)); transition: width .3s ease; }
.step-rail .step-checklist { margin-top: var(--s-1); }
.step-rail .checklist-item-text { font-size: 12.5px; }
.step-rail .checklist-evidence { margin-left: 30px; }
@media (max-width: 860px) {
  .step-cols { grid-template-columns: 1fr; gap: var(--s-4); }
  .step-rail { position: static; order: -1; max-height: none; overflow: visible; }
  .step-rail-head, .step-rail-prog { position: static; }
}

.step-checklist { display: flex; flex-direction: column; }
.checklist-item { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: var(--s-2); padding: var(--s-1) 0; border-radius: var(--radius-sm); }
.checklist-item:hover { background: color-mix(in srgb, var(--panel-2) 55%, transparent); }
.checklist-main { display: flex; align-items: flex-start; gap: var(--s-3); text-align: left; padding: 4px 2px 4px 4px; }
.checklist-checkbox { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; border: 1.5px solid var(--line-strong); border-radius: 5px; display: flex; align-items: center; justify-content: center; background: var(--inset); font-size: 11px; font-weight: 700; transition: border-color .12s ease, background .12s ease; }
.checklist-main:hover .checklist-checkbox { border-color: var(--signal); }
.checklist-checkbox.is-done { background: var(--go-wash); border-color: var(--go); color: var(--go); }
.checklist-main:hover .checklist-checkbox.is-done { border-color: var(--go); }
.checklist-checkbox.is-na { background: var(--inset); border-color: var(--line-strong); color: var(--ash-dim); border-style: dashed; }
.checklist-item-text { font-size: 13px; line-height: 1.45; }
.checklist-item.is-done .checklist-item-text { color: var(--ash-dim); text-decoration: line-through; }
.checklist-item.is-na .checklist-item-text { color: var(--ash-dim); font-style: italic; }
/* affordance de evidência: some por padrão, aparece no hover do item; fixa quando há nota */
.checklist-evi-toggle { font-size: 10.5px; color: var(--ash-dim); padding: 2px 7px; border-radius: 999px; white-space: nowrap; align-self: center; opacity: 0; transition: opacity .12s ease, color .12s ease; }
.checklist-item:hover .checklist-evi-toggle { opacity: 1; }
.checklist-evi-toggle:hover { color: var(--signal); }
.checklist-evi-toggle.has-evi { opacity: 1; color: var(--signal); background: var(--signal-wash); }
@media (hover: none) { .checklist-evi-toggle { opacity: .55; } }
.checklist-evidence { grid-column: 1 / -1; margin: var(--s-1) 0 var(--s-2) 34px; }
.checklist-evidence[hidden] { display: none; }
.checklist-evidence textarea { width: 100%; resize: vertical; background: var(--inset); border: 1px solid var(--line); border-radius: var(--radius-sm); color: var(--paper); padding: 8px 10px; font-size: 12.5px; }
.checklist-evidence textarea:focus { outline: none; border-color: var(--signal); }

/* rodapé calmo do card: contexto (se houver) + registrar achado */
.step-footer { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); margin-top: var(--s-4); padding-top: var(--s-3); border-top: 1px solid var(--line-soft); }
.details-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--ash); padding: 2px 0; }
.details-toggle:hover { color: var(--signal); }
.details-toggle-icon { font-size: 10px; color: var(--ash-dim); transition: transform .15s ease; }
.step-card.is-expanded .details-toggle-icon { transform: rotate(90deg); color: var(--signal); }
.step-add-finding { font-size: 12px; color: var(--ash-dim); padding: 4px; border-radius: var(--radius-sm); white-space: nowrap; }
.step-add-finding:hover { color: var(--signal); }

.step-detail { margin-top: var(--s-4); padding-top: var(--s-4); border-top: 1px solid var(--line-soft); }
.step-detail[hidden] { display: none; }
.detail-block { margin-top: var(--s-4); }
.detail-block:first-child { margin-top: 0; }
.detail-label { font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--ash-dim); margin-bottom: var(--s-2); }
.detail-block p { font-size: 14px; color: var(--paper); line-height: 1.6; }
.detail-block ul.plain-list { display: flex; flex-direction: column; gap: 6px; }
.detail-block ul.plain-list li { font-size: 14px; padding-left: 16px; position: relative; line-height: 1.5; }
.detail-block ul.plain-list li::before { content: "–"; position: absolute; left: 0; color: var(--signal); }
.methodology-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--s-3); }
.methodology-tag { font-size: 10.5px; font-family: var(--font-mono); padding: 3px 8px; border-radius: 999px; background: var(--inset); border: 1px solid var(--line); color: var(--ash-dim); }
.methodology-tag:is(a):hover { color: var(--signal); border-color: var(--signal); }

.tip-block { margin-top: var(--s-4); padding: var(--s-3); background: var(--signal-wash); border: 1px solid color-mix(in srgb, var(--signal) 40%, var(--line)); border-radius: var(--radius-sm); font-size: 13px; color: var(--ash); line-height: 1.5; }
.tip-block b { color: var(--signal); }

.agent-hint { font-size: 13px; color: var(--ash); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.agent-job-inline-status { font-size: 12.5px; font-family: var(--font-mono); color: var(--signal); }
.agent-job-badge { font-family: var(--font-mono); font-size: 11.5px; color: var(--signal); background: var(--signal-wash); border: 1px solid color-mix(in srgb, var(--signal) 45%, transparent); border-radius: var(--radius-sm); padding: 5px 10px; }
.agent-job-badge.is-running { animation: brand-blink 1.4s step-end infinite; }
.agent-job-badge[hidden] { display: none; }

/* Pentest Automatizado — aba Pipeline (v29): dashboard limpo, SEM metáfora de terminal.
   Faixa de controle no topo (alvo · sessão · Rodar tudo + ações), faixa de resumo abaixo
   (progresso x/y + achados/rascunhos) e um grid de cards de fase — cada card leva cabeçalho
   rico (01 · LABEL · PTES §N · contagem de ferramentas · barra de progresso da fase ·
   [Rodar fase]) e as linhas de ferramenta no corpo. Cards em grid auto-fit — a lição v25:
   layout de largura variável dentro de container fixo sempre deixa espaço morto; grid é o
   mecanismo que resolve de verdade (não ficar tunando flex/min-width à mão). */
.automacao-console { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius-lg); padding: var(--s-4) var(--s-5); box-shadow: var(--shadow-card); margin-bottom: var(--s-4); position: relative; overflow: hidden; }
.automacao-console::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--signal), transparent 75%); }
.automacao-target { display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap; margin-bottom: var(--s-3); padding-bottom: var(--s-3); border-bottom: 1px solid var(--line); }
.automacao-target-label { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--ash-dim); flex-shrink: 0; }
.automacao-target-input { flex: 1; min-width: 220px; font-family: var(--font-mono); font-size: 14px; font-weight: 600; color: var(--paper); background: var(--inset); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 8px 12px; }
.automacao-target-input:focus { outline: none; border-color: var(--signal); }
.automacao-target-input::placeholder { color: var(--ash-dim); font-weight: 400; }

/* Faixa de resumo: progresso do pipeline (done/error ÷ rodáveis) + contagem de achados/rascunhos */
.pc-summary { display: flex; align-items: center; gap: var(--s-3); border: 1px solid var(--line-soft); border-radius: var(--radius-lg); background: var(--panel); padding: 10px var(--s-3); margin-bottom: var(--s-3); box-shadow: var(--shadow-card); }
.pc-summary-prog { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
.pc-summary-label { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--ash-dim); flex-shrink: 0; }
.pc-summary-track { flex: 1; min-width: 80px; height: 6px; border-radius: 999px; background: var(--inset); border: 1px solid var(--line); overflow: hidden; }
.pc-summary-track span { display: block; height: 100%; background: linear-gradient(90deg, var(--go), var(--signal)); border-radius: 999px; transition: width .3s ease; }
.pc-summary-pct { font-family: var(--font-mono); font-size: 12.5px; font-weight: 700; color: var(--paper); white-space: nowrap; }
.pc-summary-stats { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.pc-summary-stat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ash); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; background: var(--inset); text-decoration: none; transition: border-color .12s ease, color .12s ease; }
.pc-summary-stat:hover { border-color: var(--signal); color: var(--signal); }
.pc-summary-stat .n { font-family: var(--font-mono); font-size: 14px; font-weight: 800; color: var(--paper); }

/* Cards de fase — Kanban Board (v29f) */
.kb-grid {
  display: flex; gap: var(--s-3); overflow-x: auto;
  padding-bottom: var(--s-3); align-items: flex-start;
  scroll-behavior: smooth;
  scroll-snap-type: x proximity;
  /* fade masks nas laterais para indicar scroll */
  background:
    linear-gradient(90deg, var(--ink) 0%, var(--ink) 40px, transparent 100%) left / 40px 100% no-repeat,
    linear-gradient(270deg, var(--ink) 0%, var(--ink) 40px, transparent 100%) right / 40px 100% no-repeat;
  background-attachment: scroll, scroll;
}
.kb-grid::-webkit-scrollbar { height: 8px; }
.kb-grid::-webkit-scrollbar-track { background: var(--inset); border-radius: 4px; margin: 0 4px; }
.kb-grid::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; border: 2px solid var(--inset); }
.kb-grid::-webkit-scrollbar-thumb:hover { background: var(--signal); }
.kb-grid::-webkit-scrollbar-corner { background: transparent; }
.kb-col {
  flex: 0 0 280px; min-width: 280px; max-width: 280px;
  background: var(--ink); border: 1px solid var(--line-soft); border-radius: var(--radius-lg);
  display: flex; flex-direction: column;
  scroll-snap-align: start;
}
.kb-head { display: flex; align-items: center; gap: 8px; padding: var(--s-3); border-bottom: 1px solid var(--line-soft); flex-shrink: 0; }
.kb-idx { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--signal); }
.kb-label { font-family: var(--font-mono); font-size: 12px; font-weight: 700; flex: 1; }
.kb-ref { font-family: var(--font-mono); font-size: 10px; color: var(--ash-dim); background: var(--inset); border: 1px solid var(--line); border-radius: 999px; padding: 1px 6px; }
.kb-prog { display: flex; align-items: center; gap: 8px; padding: 8px var(--s-3); border-bottom: 1px solid var(--line-soft); font-size: 11px; }
.kb-prog-track { flex: 1; height: 4px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
.kb-prog-track span { display: block; height: 100%; background: linear-gradient(90deg, var(--go), var(--signal)); }
.kb-prog-pct { font-family: var(--font-mono); font-size: 10px; color: var(--ash-dim); }
.kb-tools { flex: 1; overflow-y: auto; padding: var(--s-2); display: flex; flex-direction: column; gap: 4px; }
.kb-tools::-webkit-scrollbar { width: 6px; }
.kb-tools::-webkit-scrollbar-track { background: var(--inset); border-radius: 3px; }
.kb-tools::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }
.kb-tool { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 6px 8px; background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius-sm); font-size: 11px; }
.kb-tool:hover { border-color: var(--line); }
.kb-tool-top { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; }
.kb-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--line-strong); }
.kb-dot.is-done { background: var(--go); box-shadow: 0 0 0 2px color-mix(in srgb, var(--go) 16%, transparent); }
.kb-dot.is-run { background: var(--signal); box-shadow: 0 0 0 2px color-mix(in srgb, var(--signal) 18%, transparent); animation: brand-blink 1s step-end infinite; }
.kb-dot.is-err { background: var(--stop); }
.kb-dot.is-q { background: var(--ash-dim); box-shadow: inset 0 0 0 2px var(--ink); }
.kb-dot.is-missing { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); }
.kb-tool-name { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* chips de estado/duração (WS-E/B) */
.pc-st { font-family: var(--font-mono); font-size: 9px; border-radius: 999px; padding: 1px 6px; white-space: nowrap; flex-shrink: 0; }
.pc-st.st-done { color: var(--go); background: var(--go-wash); }
.pc-st.st-err { color: var(--stop); background: color-mix(in srgb, var(--stop) 16%, transparent); }
.kb-warn { color: var(--stop); border: 1px dashed color-mix(in srgb, var(--stop) 50%, transparent); border-radius: 999px; padding: 0 6px; font-size: 9px; font-family: var(--font-mono); white-space: nowrap; flex-shrink: 0; }
/* picker de parâmetro inline (WS-C) */
.kb-param { flex-basis: 100%; width: 100%; margin-top: 2px; background: var(--inset); border: 1px solid var(--line-soft); border-radius: 4px; color: var(--paper); font-family: var(--font-mono); font-size: 10px; padding: 3px 5px; cursor: pointer; }
.kb-param:focus { border-color: var(--signal); outline: none; }
.kb-btns { display: flex; gap: 6px; margin: var(--s-3); }
.kb-run { flex: 1; padding: 8px; background: var(--signal-wash); border: 1px solid color-mix(in srgb, var(--signal) 50%, transparent); border-radius: var(--radius-sm); color: var(--signal); font-family: var(--font-mono); font-size: 10px; font-weight: 700; cursor: pointer; text-align: center; }
.kb-run:hover { background: var(--signal); color: var(--ink); }
.kb-run:disabled, .kb-retest:disabled { opacity: .4; cursor: not-allowed; }
.kb-retest { flex: 1; padding: 8px; background: var(--inset); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); color: var(--ash); font-family: var(--font-mono); font-size: 10px; font-weight: 600; cursor: pointer; text-align: center; }
.kb-retest:hover { border-color: var(--signal); color: var(--signal); }

/* ===== /Fim Kanban ===== */

.automacao-run-row { display: flex; align-items: center; gap: var(--s-4); flex-wrap: wrap; }
.automacao-run-btn { display: inline-block; background: var(--signal-wash); color: var(--signal); border: 1px solid var(--signal); border-radius: var(--radius-sm); padding: 9px 22px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background .15s ease, color .15s ease; }
.automacao-run-btn:hover { background: var(--signal); color: var(--ink); }
.automacao-run-btn.is-running { display: inline-block; background: none; border: none; padding: 0; color: var(--signal); font-family: var(--font-mono); font-size: 12.5px; cursor: default; }
.automacao-run-caption { font-size: 12px; color: var(--ash-dim); font-family: var(--font-mono); }
.automacao-run-caption code { color: var(--paper); }
/* v24: linha de ações secundárias (re-teste / export / polidez) abaixo do botão "Rodar tudo" */
.automacao-actions-row { display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap; margin-top: var(--s-3); }
.automacao-delay { display: inline-flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ash-dim); font-family: var(--font-mono); }
.automacao-delay select { background: var(--inset); color: var(--paper); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 5px 8px; font: inherit; cursor: pointer; }
.automacao-session { display: grid; grid-template-columns: 150px minmax(0, 1fr); align-items: center; gap: 4px 12px; margin-bottom: var(--s-3); }
.automacao-session-hint { grid-column: 2; font-size: 11px; color: var(--ash-dim); font-family: var(--font-mono); }

.agent-log { display: flex; flex-direction: column; gap: 4px; font-family: var(--font-mono); font-size: 12px; }
.agent-log-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-left: 2px solid var(--line-strong); background: var(--inset); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; flex-wrap: wrap; }
.agent-log-time { color: var(--ash-dim); }
.agent-log-tool { font-weight: 700; min-width: 66px; }
.agent-log-status { text-transform: uppercase; font-size: 10.5px; letter-spacing: .04em; }
.agent-log-extra { color: var(--ash-dim); flex: 1; font-family: var(--font-ui); font-size: 11.5px; }
.agent-log-link { color: var(--signal); font-family: var(--font-ui); font-size: 11.5px; }
.agent-log-raw { background: none; border: 1px solid var(--line); color: var(--ash); border-radius: 4px; padding: 1px 6px; font-size: 10.5px; font-family: var(--font-mono); cursor: pointer; }
.agent-log-raw:hover { color: var(--signal); border-color: var(--signal); }
.agent-log-row.agent-log-status-done { border-left-color: var(--go); }
.agent-log-row.agent-log-status-done .agent-log-status { color: var(--go); }
.agent-log-row.agent-log-status-error { border-left-color: var(--stop); }
.agent-log-row.agent-log-status-error .agent-log-status { color: var(--stop); }
.agent-log-row.agent-log-status-running .agent-log-status, .agent-log-row.agent-log-status-queued .agent-log-status { color: var(--signal); }
.agent-log-row.agent-log-status-running, .agent-log-row.agent-log-status-queued { border-left-color: var(--signal); }

.notes-block textarea { width: 100%; min-height: 64px; resize: vertical; background: var(--inset); border: 1px solid var(--line); border-radius: var(--radius-sm); color: var(--paper); padding: 9px 11px; font-size: 13.5px; }
.notes-block textarea:focus { outline: none; border-color: var(--signal); }
.notes-status { font-size: 11px; color: var(--ash-dim); margin-top: 5px; }

/* ---- comandos (base compartilhada) ---- */
.command-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-2); margin-bottom: 4px; }
.command-label { font-size: 12.5px; font-weight: 600; }
.command-tool { font-size: 10.5px; color: var(--ash-dim); font-family: var(--font-mono); flex-shrink: 0; background: var(--inset); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
.command-body { position: relative; }
.command-body pre { margin: 0; background: var(--inset); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 11px 48px 11px 14px; overflow-x: auto; }
.command-body code { font-family: var(--font-mono); font-size: 13px; line-height: 1.55; color: #cdd6d8; white-space: pre; }
.var-fill { color: var(--signal-bright); background: var(--signal-wash); border-radius: 4px; padding: 0 4px; }
.var-empty { color: var(--signal); background: var(--signal-wash); border: 1px dashed color-mix(in srgb, var(--signal) 45%, transparent); border-radius: 4px; padding: 0 4px; font-weight: 600; }
.cmd-bin { font-weight: 700; }
.cmd-flag { color: var(--ash); }
.cmd-str { color: var(--go); }
.copy-btn { position: absolute; top: 6px; right: 6px; background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 5px; padding: 3px 10px; font-size: 11px; color: var(--ash); opacity: .7; transition: opacity .12s ease, color .12s ease, border-color .12s ease; }
.command-body:hover .copy-btn { opacity: 1; }
.copy-btn:hover { color: var(--signal); border-color: var(--signal); }
.command-note { font-size: 12px; color: var(--ash-dim); margin-top: 6px; line-height: 1.5; }

/* ---- passo a passo: comandos numerados ---- */
.command-steps { display: flex; flex-direction: column; gap: var(--s-3); }
.command-step { display: grid; grid-template-columns: 21px 1fr; gap: 10px; align-items: start; }
.command-step-num { font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--signal); background: var(--signal-wash); border: 1px solid color-mix(in srgb, var(--signal) 30%, var(--line)); border-radius: 999px; width: 21px; height: 21px; display: flex; align-items: center; justify-content: center; }
.command-step-body { min-width: 0; }

.tool-item { padding: 10px 0; border-top: 1px solid var(--line-soft); font-size: 13.5px; line-height: 1.5; }
.tool-item:first-child { border-top: none; padding-top: 0; }
.tool-item b a { color: var(--signal); text-decoration: none; }
.tool-item b a:hover { text-decoration: underline; }
.example-item { padding: 10px 0; border-top: 1px solid var(--line-soft); }
.example-item:first-child { border-top: none; padding-top: 0; }
.example-title { font-weight: 700; font-size: 13.5px; margin-bottom: 4px; }
.example-item pre { margin-top: 6px; background: var(--inset); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 9px 11px; overflow-x: auto; }
.example-item code { font-family: var(--font-mono); font-size: 12.5px; color: var(--ash); white-space: pre; }

/* ============================================================
   WIZARD — progresso, navegação, setup, seletor de escopo, resumo
   ============================================================ */
.content-inner.is-entering { animation: stepIn .18s ease; }
@keyframes stepIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.wizard-progress { margin-bottom: var(--s-4); }
.wizard-progress-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: var(--s-2); }
.wizard-progress-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; color: var(--signal); text-transform: uppercase; }
.wizard-progress-pct { font-size: 11.5px; color: var(--ash-dim); }
.wizard-progress-track { height: 3px; background: var(--inset); border-radius: 999px; overflow: hidden; }
.wizard-progress-fill { height: 100%; background: linear-gradient(90deg, color-mix(in srgb, var(--signal) 70%, var(--go)), var(--signal)); transition: width .3s ease; }

.wizard-nav { display: flex; gap: 12px; margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); }
.wizard-nav-spacer { flex: 1; }
.wizard-btn {
  flex: 1; display: flex; flex-direction: column; gap: 2px; text-align: left;
  padding: 11px 15px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  background: var(--panel-2); color: var(--ash);
}
.wizard-btn:hover { border-color: var(--signal); color: var(--paper); }
.wizard-btn-primary { text-align: right; background: var(--signal-wash); border-color: color-mix(in srgb, var(--signal) 55%, var(--line)); color: var(--paper); }
.wizard-btn-primary:hover { border-color: var(--signal); }
.wizard-btn-dir { font-size: 13px; font-weight: 700; }
.wizard-btn-primary .wizard-btn-dir { color: var(--signal); }
.wizard-btn-label { font-size: 11.5px; color: var(--ash-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wizard-btn.is-disabled, .wizard-btn:disabled { opacity: .45; cursor: not-allowed; border-color: var(--line); }
.wizard-btn.is-disabled:hover { border-color: var(--line); color: var(--ash); }

/* ---- setup ---- */
.setup-section { margin-top: 22px; }
.setup-section:first-of-type { margin-top: 4px; }
.setup-hint { font-size: 12.5px; color: var(--ash-dim); margin: 4px 0 12px; }
.setup-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.setup-grid.is-wide { grid-template-columns: 1fr; }
.setup-field { display: flex; flex-direction: column; gap: 5px; }
.setup-field.is-var input { font-family: var(--font-mono); }
.setup-label { font-size: 12.5px; font-weight: 600; color: var(--paper); display: flex; align-items: center; gap: 8px; }
.setup-req { font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--signal); border: 1px solid color-mix(in srgb, var(--signal) 45%, var(--line)); border-radius: 3px; padding: 1px 5px; }
.setup-field input, .setup-field textarea {
  background: var(--inset); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 9px 11px; font-size: 13.5px; color: var(--paper); width: 100%; resize: vertical;
}
.setup-field input:focus, .setup-field textarea:focus { outline: none; border-color: var(--signal); }
.setup-field.is-missing input, .setup-field.is-missing textarea { border-color: color-mix(in srgb, var(--stop) 60%, var(--line)); }
.setup-blocker { margin-top: 18px; padding: 10px 12px; border: 1px dashed color-mix(in srgb, var(--stop) 55%, var(--line)); border-radius: var(--radius-sm); background: color-mix(in srgb, var(--stop) 8%, var(--inset)); font-size: 12.5px; color: var(--paper); }
.setup-blocker[hidden] { display: none; }

/* ---- seletor de escopo ---- */
.scope-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--s-3); margin-top: var(--s-2); }
.scope-card {
  display: flex; flex-direction: column; gap: 7px; text-align: left;
  padding: var(--s-4); border: 1px solid var(--line-soft); border-radius: var(--radius-lg); background: var(--panel); box-shadow: var(--shadow-card);
  transition: border-color .12s ease, transform .12s ease;
}
.scope-card:hover { border-color: var(--signal); background: var(--panel-2); transform: translateY(-1px); }
.scope-card.is-active { border-color: var(--signal); background: var(--signal-wash); }
.scope-card-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.scope-card-current { font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--signal); border: 1px solid var(--signal); border-radius: 3px; padding: 1px 5px; }
.scope-card-desc { font-size: 13px; color: var(--ash); flex: 1; }
.scope-card-meta { font-family: var(--font-mono); font-size: 11px; color: var(--ash-dim); }

/* ---- resumo ---- */
.resumo-section-label { font-family: var(--font-mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ash-dim); margin: 22px 0 8px; }
.resumo-section-label:first-of-type { margin-top: 6px; }
.resumo-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.resumo-row { display: grid; grid-template-columns: 1fr auto 120px; align-items: center; gap: 14px; text-align: left; padding: 12px 15px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--panel); }
.resumo-row:hover { border-color: var(--signal); }
.resumo-row.is-static { cursor: default; }
.resumo-row.is-static:hover { border-color: var(--line); }
.resumo-row-label { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.resumo-row-label .step-domain-dot { margin-top: 0; }
.resumo-row-count { font-family: var(--font-mono); font-size: 12.5px; color: var(--ash-dim); }
.resumo-row.is-done .resumo-row-count { color: var(--go); }
.resumo-row.is-partial .resumo-row-count { color: var(--signal); }
.resumo-row-track { height: 5px; background: var(--inset); border-radius: 999px; overflow: hidden; }
.resumo-row-fill { display: block; height: 100%; background: var(--signal); }
.resumo-row.is-done .resumo-row-fill { background: var(--go); }

/* ---- barra de etapa mobile ---- */
.mobile-stepbar { display: none; }
.mobile-stepbar[hidden] { display: none !important; }

/* ---- busca: divisor de escopo e resultado fora-de-escopo ---- */
.search-divider { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--ash-dim); margin: 10px 4px 4px; }
.search-result.is-out-of-scope { opacity: .62; }

/* ---- botão "+ registrar achado" no módulo ---- */
.step-actions { margin-top: 14px; }
.step-add-finding { font-size: 12px; color: var(--ash); border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); padding: 6px 11px; }
.step-add-finding:hover { color: var(--signal); border-color: var(--signal); }

/* ============================================================
   ACHADOS & RELATÓRIO
   ============================================================ */
.report-summary { display: flex; flex-wrap: wrap; gap: 10px; margin: 4px 0 18px; }
.severity-tally { display: flex; align-items: center; gap: 7px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm); }
.severity-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--sev, var(--ash)); flex-shrink: 0; }
.severity-tally-count { font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: var(--paper); }
.severity-tally-label { font-size: 12px; color: var(--ash); }
/* Chip preenchido — antes era só contorno fino, sutil demais no tema quase-preto pra ser
   o principal sinal de gravidade. Fundo/borda derivam de --sev via color-mix, então cada
   "wash" de cor (mesmo princípio do status pill). */
.severity-chip { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--sev, var(--ash)); background: color-mix(in srgb, var(--sev, var(--ash)) 18%, transparent); border: 1px solid color-mix(in srgb, var(--sev, var(--ash)) 55%, transparent); border-radius: 4px; padding: 2px 7px; white-space: nowrap; flex-shrink: 0; }

.achados-toolbar { display: flex; gap: 8px; margin-bottom: var(--s-4); flex-wrap: wrap; align-items: center; padding: var(--s-3); background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
.achados-delete-all { margin-left: auto; }

/* ---- ACHADOS (design system inline; sem framework externo, mantém arquivo único/offline
   — ver "Achados & Relatório" no CLAUDE.md). v19: painel de resumo (total + tiles de
   severidade que também filtram) no lugar do dash fino; itens recolhidos por padrão;
   detalhe com modo leitura formatado (tabela estruturada de evidência) e modo edição. ---- */
.ach-summary { display: flex; align-items: stretch; gap: var(--s-5); border: 1px solid var(--line-soft); border-radius: var(--radius-lg); background: var(--panel); box-shadow: var(--shadow-card); padding: var(--s-4) var(--s-5); margin: 2px 0 var(--s-5); position: relative; overflow: hidden; }
.ach-summary::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, var(--sev-critical), var(--sev-high), var(--sev-medium), var(--sev-low), var(--sev-info)); opacity: .7; }
.ach-summary-total { display: flex; flex-direction: column; justify-content: center; align-items: center; padding-right: var(--s-5); border-right: 1px solid var(--line); flex-shrink: 0; }
.ach-summary-num { font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -.03em; color: var(--paper); font-variant-numeric: tabular-nums; }
.ach-summary-lbl { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--ash-dim); margin-top: 6px; }
.ach-summary-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--s-3); justify-content: center; }
.ach-sevtiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; }
.ach-sevtile { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 8px 12px; border: 1px solid var(--line-soft); border-top: 3px solid var(--sev); border-radius: var(--radius-sm); background: var(--panel); cursor: pointer; color: inherit; font: inherit; transition: background .12s ease, border-color .12s ease, transform .1s ease, box-shadow .12s ease; }
.ach-sevtile:hover { background: var(--panel-2); border-color: var(--line); transform: translateY(-1px); box-shadow: var(--shadow-card); }
.ach-sevtile.is-active { background: color-mix(in srgb, var(--sev) 18%, var(--panel)); border-color: var(--sev); box-shadow: 0 0 0 1px var(--sev); }
.ach-sevtile.is-zero { opacity: .45; }
.ach-sevtile-count { font-family: var(--font-mono); font-size: 22px; font-weight: 800; line-height: 1; color: var(--sev); font-variant-numeric: tabular-nums; }
.ach-sevtile-label { font-size: 10.5px; font-weight: 600; color: var(--ash); text-transform: uppercase; letter-spacing: .04em; }
.ach-dist { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--inset); border: 1px solid var(--line-soft); }
.ach-dist-seg { min-width: 4px; height: 100%; transition: width .4s ease; }
.ach-dist-empty { flex: 1; }
/* v25: resumo de risco do engajamento no dashboard de achados */
.ach-summary-risk { display: flex; flex-direction: column; justify-content: center; min-width: 150px; border-left: 1px solid var(--line-soft); padding-left: var(--s-4); }
.ach-risk-top { display: flex; align-items: baseline; gap: 8px; }
.ach-risk-grade { font-family: var(--font-mono); font-size: 26px; font-weight: 800; line-height: 1; }
.ach-risk-label { font-size: 11px; color: var(--ash); text-transform: uppercase; letter-spacing: .06em; }
.ach-risk-score { font-family: var(--font-mono); font-size: 12px; color: var(--ash-dim); margin-top: 2px; }

/* grupos por severidade */
.ach-group { margin-bottom: var(--s-5); }
.ach-group:last-child { margin-bottom: 0; }
.ach-group-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line-soft); }
.ach-group-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 4px color-mix(in srgb, var(--gsev, var(--ash)) 18%, transparent); }
.ach-group-label { font-family: var(--font-mono); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--gsev); }
.ach-group-count { font-family: var(--font-mono); font-size: 11px; color: var(--ash-dim); background: var(--inset); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.ach-group-pct { font-family: var(--font-mono); font-size: 10px; color: var(--ash-dim); padding-left: 2px; }
.ach-group-rule { flex: 1; height: 1px; background: var(--line-soft); }
.ach-group-list { display: flex; flex-direction: column; gap: 8px; }

/* item */
.ach-item { border: 1px solid var(--line-soft); border-left: 4px solid var(--sev, var(--line-soft)); border-radius: var(--radius-lg); background: var(--panel); box-shadow: var(--shadow-card); overflow: hidden; transition: box-shadow .15s ease, border-color .15s ease, transform .1s ease; }
.ach-item:hover { border-color: var(--line-strong); box-shadow: var(--shadow-pop); transform: translateX(2px); }
.ach-item.is-draft { border-left-color: var(--signal); }
.ach-item.is-fp { border-left-color: var(--stop); opacity: .82; }
.ach-item.is-fp .ach-item-title { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--stop) 55%, transparent); }
.ach-item-head { display: flex; align-items: flex-start; gap: 14px; padding: 14px var(--s-4); }
.ach-item-toggle { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; background: none; border: none; padding: 0; margin: 0; text-align: left; cursor: pointer; color: inherit; font: inherit; }
.ach-item-row1 { display: flex; align-items: center; gap: 12px; min-width: 0; }
.ach-item-title { flex: 1; min-width: 0; font-size: 15px; font-weight: 650; line-height: 1.35; color: var(--paper); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ach-item-caret { font-size: 11px; color: var(--ash-dim); transition: transform .15s ease, color .15s ease; flex-shrink: 0; align-self: center; }
.ach-item-toggle[aria-expanded="true"] .ach-item-caret { transform: rotate(90deg); color: var(--signal); }
/* faixa de metadados rotulada (issue-tracker): uma família só, sem caixas — labels mono
   minúsculos + valores discretos; "alvo" fica em destaque mono com ellipsis + tooltip. */
.ach-item-row2 { display: flex; align-items: baseline; gap: 6px 18px; flex-wrap: wrap; padding-left: 1px; }
.ach-meta-item { display: inline-flex; align-items: baseline; gap: 5px; min-width: 0; font-family: var(--font-mono); font-size: 11px; color: var(--ash); }
.ach-meta-k { font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ash-dim); font-weight: 600; flex-shrink: 0; }
.ach-meta-v { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ach-meta-v.is-target { color: var(--paper); font-weight: 600; }
.ach-item-del { flex-shrink: 0; opacity: 0; transition: opacity .12s ease; }
/* WS-F: checkbox de triagem em lote + barra de ações da seleção */
.ach-triage { flex-shrink: 0; display: inline-flex; align-items: center; margin-top: 2px; cursor: pointer; }
.ach-triage input { width: 14px; height: 14px; accent-color: var(--signal); cursor: pointer; }
.achados-triage-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: -2px 0 10px; padding: 8px 12px; background: var(--signal-wash); border: 1px solid color-mix(in srgb, var(--signal) 40%, transparent); border-radius: var(--radius-sm); }
.achados-triage-count { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--signal); margin-right: 4px; }
.ach-item:hover .ach-item-del, .ach-item-del:focus-visible { opacity: 1; }

/* badges (familia quieta unica — status pill + chips raros stalled/re-teste) */
.finding-status-tag { color: var(--stc, var(--ash)); background: color-mix(in srgb, var(--stc, var(--ash)) 16%, transparent); border: 1px solid color-mix(in srgb, var(--stc, var(--ash)) 40%, transparent); border-radius: 999px; padding: 2px 8px; font-size: 10.5px; font-family: var(--font-mono); white-space: nowrap; font-weight: 600; }
.finding-stalled { color: var(--stop); border: 1px dashed color-mix(in srgb, var(--stop) 50%, transparent); border-radius: 999px; padding: 2px 8px; font-size: 10.5px; font-family: var(--font-mono); white-space: nowrap; }
.finding-retest-missing { color: var(--go); border: 1px dashed color-mix(in srgb, var(--go) 50%, transparent); border-radius: 999px; padding: 2px 8px; font-size: 10.5px; font-family: var(--font-mono); white-space: nowrap; }

/* card de risco na home */
.home-stat-risk { display: flex; align-items: center; gap: 10px; }
.home-risk-grade { font-family: var(--font-mono); font-size: 22px; font-weight: 800; }
.home-risk-score { font-size: 11.5px; color: var(--ash-dim); line-height: 1.35; }

/* v25: referências CWE (leitura do achado + relatório) */
.cwe-refs, .report-cwe-refs { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
.cwe-ref { display: inline-block; font-family: var(--font-mono); font-size: 10.5px; color: var(--signal); border: 1px solid color-mix(in srgb, var(--signal) 40%, transparent); background: var(--signal-wash); border-radius: 999px; padding: 2px 8px; text-decoration: none; font-weight: 600; transition: border-color .12s ease, background .12s ease; }
.cwe-ref:hover { border-color: var(--signal); background: color-mix(in srgb, var(--signal) 18%, var(--panel)); }

/* v25: achados relacionados (leitura do achado) */
.ach-related { margin-top: var(--s-4); border-top: 1px dashed var(--line-soft); padding-top: var(--s-3); }
.ach-related-h { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ash-dim); margin-bottom: 6px; font-family: var(--font-mono); }
.ach-related-list { display: flex; flex-direction: column; gap: 4px; }
.ach-related-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius-sm); transition: border-color .15s ease; }
.ach-related-item:hover { border-color: var(--line); }
.ach-related-item a { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--paper); text-decoration: none; font-weight: 500; }
.ach-related-item a:hover { color: var(--signal); }
.ach-related-src { font-family: var(--font-mono); font-size: 9px; color: var(--ash-dim); background: var(--inset); padding: 1px 6px; border-radius: 999px; }
.ach-related-merge { margin-left: auto; flex-shrink: 0; font-size: 10px; padding: 4px 10px; }
.ach-related-cve { font-family: var(--font-mono); font-size: 10px; color: var(--sev-medium); background: color-mix(in srgb, var(--sev-medium) 12%, transparent); padding: 1px 6px; border-radius: 999px; }

/* v25: chip de filtro ativo por ativo na barra de ferramentas */
.achados-asset-chip { display: inline-flex; align-items: center; gap: 8px; margin: -6px 0 10px; font-size: 11.5px; color: var(--ash); border: 1px solid var(--line-soft); border-radius: 999px; padding: 4px 12px; background: var(--panel); }
.achados-asset-chip strong { color: var(--signal); font-family: var(--font-mono); font-weight: 600; }

/* v25: página #/ativos — inventário derivado */
.ativos-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--s-4); }
.ativo-card { border: 1px solid var(--line-soft); border-left: 3px solid var(--dom-general, var(--signal)); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow-card); padding: var(--s-4); display: flex; flex-direction: column; gap: 10px; }
.ativo-link { background: none; border: none; padding: 0; margin: 0; text-align: left; cursor: pointer; font: inherit; font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: var(--paper); }
.ativo-link:hover { color: var(--signal); }
.ativo-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.ativo-kv { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11.5px; color: var(--ash); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; background: var(--inset); }
.ativo-kv b { color: var(--ash-dim); font-weight: 500; text-transform: uppercase; font-size: 10px; letter-spacing: .05em; }
.ativo-foot { display: flex; align-items: center; gap: 10px; margin-top: auto; font-size: 11px; color: var(--ash-dim); border-top: 1px solid var(--line-soft); padding-top: 9px; }
.ativo-srcs { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ativo-findings { color: var(--ash); font-family: var(--font-mono); }
.ativo-sev-pip { font-family: var(--font-mono); font-size: 10px; color: var(--ink); border-radius: 3px; padding: 0 5px; font-weight: 700; }

/* v25: relatório v2 — capa, gráficos, tabelas e anexos */
.report-cover { border: 1px solid var(--line-soft); border-radius: var(--radius-lg); background: linear-gradient(160deg, var(--panel-2), var(--panel)); padding: var(--s-5); margin-bottom: var(--s-5); }
.report-cover-eyebrow { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--signal); }
.report-cover-title { font-size: 24px; font-weight: 800; color: var(--paper); margin: 6px 0 2px; }
.report-cover-sub { color: var(--ash); font-size: 13px; margin-bottom: var(--s-4); }
.report-cover-risk { display: flex; align-items: baseline; gap: 10px; border-top: 1px dashed var(--line-soft); border-bottom: 1px dashed var(--line-soft); padding: 10px 0; margin-bottom: var(--s-4); }
.report-cover-grade { font-family: var(--font-mono); font-size: 30px; font-weight: 800; line-height: 1; }
.report-cover-risk-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ash); }
.report-cover-score { font-family: var(--font-mono); font-size: 12px; color: var(--ash-dim); }
.report-cover-meta { display: flex; flex-wrap: wrap; gap: 4px 20px; font-family: var(--font-mono); font-size: 12px; color: var(--ash-dim); }
.report-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--s-5); margin: var(--s-4) 0 var(--s-5); }
.report-chart-block { border: 1px solid var(--line-soft); border-radius: var(--radius); padding: var(--s-4); background: var(--panel); }
.report-chart-label { font-size: 12px; color: var(--ash); margin-bottom: 8px; }
.report-chart { display: block; max-width: 100%; height: auto; }
.report-table-wrap { overflow-x: auto; margin: var(--s-2) 0 var(--s-5); }
.report-table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.report-table th, .report-table td { border: 1px solid var(--line-soft); padding: 6px 9px; text-align: left; vertical-align: top; }
.report-table th { background: var(--inset); color: var(--ash); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.report-remed-n { font-family: var(--font-mono); color: var(--ash-dim); }
.report-remed-sev { color: var(--sev); font-weight: 700; white-space: nowrap; }
.report-empty { color: var(--ash-dim); font-style: italic; margin: 4px 0 var(--s-4); }
/* impressão: os controles saem, o conteúdo da capa/tabelas entra no PDF */
@media print {
  .report-cover, .report-charts, .report-table, .report-table-wrap { break-inside: avoid; }
  .report-actions { display: none; }
}

/* detalhe expandido */
.ach-detail { border-top: 1px solid var(--line-soft); background: var(--panel-2); padding: var(--s-4); }
.ach-detail-actions { display: flex; justify-content: flex-end; margin-bottom: var(--s-3); }

/* Modo leitura (v29): painel limpo no lugar da janela de terminal v22 — grid chave:valor
   (severidade/status/CVSS/CWE/ativo/ferramenta + campos meta da ferramenta) e depois as
   seções descrição / evidência / recomendação. Mesma família visual dos cards de fase
   (.pc-card): --panel + --line-soft + --radius-lg + --shadow-card. --sev continua vindo do
   wrapper .ach-item pros chips. */
.ach-read-panel { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: var(--s-5) var(--s-6); position: relative; overflow: hidden; }
.ach-read-panel::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--sev); opacity: .85; }
.ach-read-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px 24px; margin-bottom: var(--s-4); }
.ach-kv { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ach-k { font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ash-dim); font-weight: 600; }
/* Bloco "superfície de ataque" (v31): o achado desta ferramenta é o que o ATACANTE faz —
   aparece destacado, borda/acento na cor da severidade, antes das seções de texto. */
.ach-read-attack { display: flex; flex-direction: column; gap: 4px; margin: 0 0 var(--s-4); padding: 10px 14px; border: 1px solid color-mix(in srgb, var(--sev) 45%, transparent); border-left: 3px solid var(--sev); background: color-mix(in srgb, var(--sev) 10%, var(--panel)); border-radius: var(--radius-sm); }
.ach-read-attack-k { font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--sev); font-weight: 700; }
.ach-read-attack-v { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--paper); line-height: 1.5; overflow-wrap: anywhere; }
.ach-v { font-family: var(--font-mono); font-size: 13px; color: var(--paper); overflow-wrap: anywhere; line-height: 1.45; font-weight: 500; }

/* v17: tabela de resultados estruturados — o Agente Pi manda meta/items tipados por

.ach-items-table-wrap { max-height: 380px; overflow: auto; }

  function getFindings() { return getEngagementState(getCurrentEngagementId()).findings; }
  function addFinding(partial) {

    if (patch.status && patch.status !== f.status) {

    if (!active.length) return; /* nada ativo — nem vale fazer o parse do estado de novo */
    active.forEach(function (s) {
      fetch(agentApiUrl(cfg, '/api/v1/jobs/' + s.id), { headers: { 'Authorization': 'Bearer ' + cfg.token } })
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (meta) {
          if (!meta || meta.status === s.status) return;
          var stNow = getEngagementState(engId);
          var scanNow = stNow.scans.find(function (x) { return x.id === s.id; });
          if (!scanNow) return;
          scanNow.status = meta.status; scanNow.updatedAt = Date.now(); scanNow.warning = meta.warning || null;

            showToast(scanNow.tool + ' falhou: ' + (meta.error || 'erro desconhecido'));

    if (running) { badge.hidden = false; badge.textContent = running + ' scan(s) em execução no Pi'; badge.classList.add('is-running'); return; }

  function parseHash() {

    if (!parts.length) return { view: 'inicio' }; /* v14: primeira carga cai na página inicial */
    if (parts[0] === 'inicio') return { view: 'inicio' };
    if (parts[0] === 'escopo') return { view: 'escopo' };
    if (parts[0] === 'resumo') return { view: 'resumo' };
    if (parts[0] === 'ativos') return { view: 'ativos' };
    if (parts[0] === 'achados') return { view: 'achados', finding: parts[1] || null };
    if (parts[0] === 'relatorio') return { view: 'relatorio' };
    /* 'automacao' era o nome antigo; 'pentest-automatizado'/'pentest' são os canônicos (v14) —
       todos abrem a mesma tela (aba Pipeline). */
    if (parts[0] === 'automacao' || parts[0] === 'pentest-automatizado' || parts[0] === 'pentest') return { view: 'automacao' };
    if (parts[0] === 'metodologias') return { view: 'metodologias' };
    /* '#/fase/...' era a rota da v2; mantida como alias para não quebrar links salvos. */
    if ((parts[0] === 'etapa' || parts[0] === 'fase') && parts[1]) return { view: 'etapa', id: parts[1], step: parts[2] || null };
    return { view: 'etapa', id: null };

  function resolveRoute() {
    var r = parseHash();

    if (r.view === 'inicio') return r; /* v14: a home funciona com ou sem escopo definido */

    var scopeId = currentScopeId();
    if (!scopeId) return { view: 'escopo', redirect: '#/escopo' };
    if (r.view === 'escopo') return r;
    /* Achados, relatório e automação exigem só o escopo — pode-se registrar achado ou disparar
       um scan a qualquer momento, inclusive antes do setup estar completo. */
    if (r.view === 'achados' || r.view === 'relatorio' || r.view === 'automacao' || r.view === 'ativos') return r;
    if (r.view === 'resumo') return setupComplete() ? r : { view: 'etapa', id: 'setup', step: null, redirect: '#/etapa/setup' };

    var wiz = wizardSteps(scopeId);
    var target = r.id;
    /* Deep link da busca pode apontar para uma fase fora da trilha do escopo atual (ex: um
       step de AD estando em Web). Se o stepId existe, deixamos passar — renderPhasePage o
       mostra à parte — em vez de redirecionar e perder o resultado clicado. */
    var deepStep = r.step && STEPS.some(function (s) { return s.id === r.step; });
    if (!target || (wizardIndexOf(scopeId, target) === -1 && !deepStep)) {
      target = wiz[0].id;

    if (target !== 'setup' && !setupComplete()) return { view: 'etapa', id: 'setup', step: null, redirect: '#/etapa/setup' };

  /* Colore o binário inicial, flags e strings entre aspas de um trecho literal (não-<<TOKEN>>) de comando. */
  function highlightFragment(text, leading) {
    var out = '', pos = 0;
    if (leading) {
      var bm = /^(\s*)(\S+)/.exec(text);
      if (bm) { out += escapeHTML(bm[1]) + '<span class="cmd-bin">' + escapeHTML(bm[2]) + '</span>'; pos = bm[0].length; }
    }
    var rest = text.slice(pos), last2 = 0, mm;
    HL_TOKEN_RE.lastIndex = 0;
    while ((mm = HL_TOKEN_RE.exec(rest))) {
      out += escapeHTML(rest.slice(last2, mm.index));
      var tok = mm[0], cls = (tok.charAt(0) === '"' || tok.charAt(0) === "'") ? 'cmd-str' : 'cmd-flag';
      out += '<span class="' + cls + '">' + escapeHTML(tok) + '</span>';

    }

  }

  function renderScopePicker() {

  function renderSetupPage() {

  /* Atualiza o estado do botão Avançar SEM re-render — um render() aqui recriaria os
     <input> e derrubaria o foco/cursor no meio da digitação. */
  function syncSetupValidity() {
    var blocker = document.querySelector('[data-setup-blocker]');
    if (!blocker) return;
    var missing = missingRequiredVars();
    var nextBtn = document.querySelector('.wizard-btn-primary');
    document.querySelectorAll('[data-setup-cell]').forEach(function (cell) {
      var key = cell.getAttribute('data-setup-cell');
      cell.classList.toggle('is-missing', missing.some(function (f) { return f.key === key; }));
    });
    if (missing.length) {
      blocker.hidden = false;
      blocker.textContent = 'Preencha para avançar: ' + missing.map(function (f) { return f.label; }).join(', ') + '.';
      if (nextBtn) { nextBtn.disabled = true; nextBtn.classList.add('is-disabled'); }
    } else {
      blocker.hidden = true;
      if (nextBtn) { nextBtn.disabled = false; nextBtn.classList.remove('is-disabled'); }
    }
  }

  function renderPhasePage(phaseId, jumpStepId) {
    var phase = PHASES.find(function (p) { return p.id === phaseId; });
    var scopeId = currentScopeId();
    if (!phase) { content.innerHTML = '<div class="empty-state">Etapa não encontrada.</div>'; return; }
    var allInPhase = stepsForScope(phaseId, scopeId);
    if (jumpStepId) {
      var jumpStep = STEPS.find(function (s) { return s.id === jumpStepId; });
      /* Deep link da busca pode apontar para um step fora do escopo: mostra assim mesmo,
         em vez de levar a uma página onde ele simplesmente não existe. */
      if (jumpStep && allInPhase.indexOf(jumpStep) === -1) allInPhase = allInPhase.concat([jumpStep]);
      if (jumpStep) { domainFilterByPhase[phaseId] = jumpStep.domain; expandedSteps[jumpStepId] = true; }
    }
    var domainsPresent = uniq(allInPhase.map(function (s) { return s.domain; }));
    var currentFilter = domainFilterByPhase[phaseId] || 'all';
    if (currentFilter !== 'all' && domainsPresent.indexOf(currentFilter) === -1) currentFilter = domainFilterByPhase[phaseId] = 'all';
    var visible = currentFilter === 'all' ? allInPhase : allInPhase.filter(function (s) { return s.domain === currentFilter; });
    var afterDomain = visible.length;
    var completedCount = visible.filter(function (s) { var pr = stepProgress(s); return pr && pr.total > 0 && pr.pct === 100; }).length;
    if (hideCompleted) visible = visible.filter(function (s) { var pr = stepProgress(s); return !(pr && pr.total > 0 && pr.pct === 100); });
    var idx = wizardIndexOf(scopeId, phaseId), wiz = wizardSteps(scopeId);
    var next = wiz[idx + 1];

    var html = wizardProgressHTML(phaseId);
    html += '<div class="phase-header"><div class="phase-eyebrow">' + escapeHTML(phase.ref) + (next ? ' · Próxima: ' + escapeHTML(next.label) : ' · Última etapa') + '</div>';
    html += '<div class="phase-title">' + escapeHTML(phase.label) + '</div>';
    html += '<div class="phase-desc">' + escapeHTML(phase.desc) + '</div></div>';

    if (domainsPresent.length > 1) {
      html += '<div class="domain-filter-row"><button class="domain-chip' + (currentFilter === 'all' ? ' is-active' : '') + '" data-domain-filter="all">Todos</button>';
      domainsPresent.forEach(function (d) {
        html += '<button class="domain-chip' + (currentFilter === d ? ' is-active' : '') + '" style="--chip-color:' + domainColor(d) + '" data-domain-filter="' + d + '">' + escapeHTML(DOMAIN_LABELS[d]) + '</button>';
      });
      html += '</div>';
    }
    if (afterDomain && completedCount) {
      html += '<div class="phase-toolbar no-print">' +
        '<button class="phase-tool' + (hideCompleted ? ' is-active' : '') + '" data-hide-completed>' + (hideCompleted ? 'Mostrar concluídos (' + completedCount + ')' : 'Ocultar concluídos (' + completedCount + ')') + '</button>' +
        '</div>';
    }
    html += visible.length
      ? '<div class="step-list">' + visible.map(stepRowHTML).join('') + '</div>'
      : '<div class="empty-state">' + (hideCompleted && afterDomain ? 'Todos os módulos visíveis estão concluídos.' : 'Nenhum módulo deste domínio nesta etapa. Selecione "Todos" para ver o restante.') + '</div>';
    html += wizardNavHTML(phaseId);
    content.innerHTML = html;

    if (jumpStepId) {
      var el = document.getElementById('step-' + jumpStepId);
      if (el) setTimeout(function () { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60);
    }
  }

      '<button class="wizard-btn" data-scope-change="1"><span class="wizard-btn-dir">Trocar escopo</span><span class="wizard-btn-label">Reconfigura a trilha</span></button></div>';

  /* Linha do tempo do engajamento (v23): reusa o visual terminal-log do agente (.agent-log),

  var JOURNAL_KIND_COLOR = { escopo: 'var(--go)', scan: 'var(--signal)', achado: 'var(--sev-medium)' };
  function journalHTML(list, limit) {

  function achadosDashHTML(list, active) {

    var ITEMS_PAGE = 100;

  /* Bloco de evidência do achado (v17): prioriza f.items (estruturado, vindo do Agente Pi)

  function achadosEvidenceHTML(f) {

  /* Formata evidência (v12): texto de várias linhas curtas (ex: lista de diretórios/hosts/
     portas que o Agente Pi agrega, um por linha) vira um bloco de resultados tabular com
     índice e badge de status HTTP quando detectado no fim da linha; texto único/prosa
     (request-response, saída de comando) fica num <pre> monoespaçado. Só apresentação —
     o dado bruto continua editável no modo edição. Fallback pra achados sem f.items — ver
     achadosEvidenceHTML(). */
  function formatEvidenceHTML(text) {
    var raw = (text || '').replace(/\s+$/, '');
    if (!raw.trim()) return '<div class="ach-empty-field">— nenhuma evidência registrada —</div>';
    var lines = raw.split(/\r?\n/).map(function (l) { return l.replace(/\s+$/, ''); }).filter(function (l) { return l.trim(); });
    /* separa o corpo (path/host/url) de um código de status HTTP opcional no fim da linha */
    function parseLine(l) {
      var t = l.trim();
      var m = t.match(/(?:[\[\(]|\s+|->|=>|→)\s*(\d{3})\s*[\]\)]?$/);
      var code = m ? m[1] : '';
      var body = code ? (t.slice(0, m.index).replace(/[\s\-\[\(=>→]+$/, '') || t) : t;
      return { code: code, body: body };
    }
    /* Só vira lista de resultados se cada linha for um "item" token-like (path/host/subdomínio/
       url, sem espaços internos), 3+ linhas e sem linha em branco. Isso pega os casos que o
       usuário quer bem apresentados — diretórios/hosts/subdomínios encontrados — sem confundir
       um request/response ou prosa (que têm espaços internos e blocos separados por linha em
       branco) com uma lista; esses caem no <pre> monoespaçado. */
    var blankLine = /\n[ \t]*\n/.test(raw);
    var itemish = lines.length >= 3 && !blankLine && lines.every(function (l) {
      var p = parseLine(l);
      return p.body.length > 0 && p.body.length <= 100 && !/\s/.test(p.body);
    });
    if (!itemish) return '<pre class="ach-pre">' + escapeHTML(raw) + '</pre>';
    var rows = lines.map(function (l, i) {
      var p = parseLine(l);
      var cls = p.code ? ('is-' + p.code.charAt(0) + 'xx') : '';
      return '<div class="ach-result"><span class="ach-result-idx">' + (i + 1) + '</span>' +
        '<span class="ach-result-text" title="' + escapeHTML(l.trim()) + '">' + escapeHTML(p.body) + '</span>' +
        (p.code ? '<span class="ach-result-code ' + cls + '">' + escapeHTML(p.code) + '</span>' : '') + '</div>';
    }).join('');
    return '<div class="ach-results"><div class="ach-results-head"><span class="ach-results-title">Resultados encontrados</span>' +
      '<span class="ach-results-count">' + lines.length + (lines.length === 1 ? ' item' : ' itens') + '</span></div>' +
      '<div class="ach-results-list">' + rows + '</div></div>';
  }
  /* Modo leitura (v29): painel limpo no lugar da janela de terminal v22 — grid chave:valor

      }
    });
    var refs = cweRefsHTML(f.cwe);

      '<div class="ach-read-grid">' + grid + '</div>' +

  /* WS-F: próximo rascunho na ordem da lista (pra revisar em sequência sem voltar à lista). */

  /* Item de achado (v12): recolhido por padrão (expandedFindings[f.id] === true; ver

  function achadosRowHTML(f) {

    var stm = statusMeta(f.status);

  /* Agrupado por severidade (crítico→info, mesma ordem que o relatório usa); só grupos

  /* ============================================================
     REGISTRO DE ATIVOS (v25) — inventário estruturado extraído dos resultados do pipeline.
     NADA é persistido: os ativos são derivados a cada render a partir dos achados (f.items

  function hostOfUrl(u) { return String(u || '').replace(/^https?:\/\//i, '').split(/[/?#:]/)[0]; }
  function assetsFromFindings() {
    var map = {};

      var a = map[key];
      Object.keys(patch || {}).forEach(function (k) {
        if (k === 'sourceTool') return;
        if (patch[k] !== undefined && patch[k] !== null && patch[k] !== '' && !a[k]) a[k] = patch[k];
      });
