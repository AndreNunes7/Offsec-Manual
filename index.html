    }
    getFindings().forEach(function (f) {
      var tool = f.sourceTool;
      if (f.items && f.items.length) {
        f.items.forEach(function (it) {
          if (tool === 'nmap' && it.host) add(it.host + ':' + (it.port || ''), { host: it.host, port: it.port, protocol: it.protocol, service: it.service, product: it.product, version: it.version, sourceTool: tool });
          else if (tool === 'httpx' && (it.label || it.url)) { var hu = it.label || it.url; add(hu, { url: hu, host: hostOfUrl(hu), statusCode: it.statusCode, title: it.title, tech: it.tech, webServer: it.webServer, sourceTool: tool }); }
          else if (tool === 'oblivion-webrecon' && it.label) add(it.label, { url: it.label, host: hostOfUrl(it.label), statusCode: it.statusCode, size: it.size, type: it.type, sourceTool: tool });

      if (f.meta && (f.meta.host || f.meta.port)) add((f.meta.host || f.affected) + ':' + (f.meta.port || ''), { host: f.meta.host || f.affected, port: f.meta.port, protocol: f.meta.protocol, service: f.meta.service, product: f.meta.product, version: f.meta.version, sourceTool: tool });

    var assets = Object.keys(map).map(function (k) { return map[k]; });

  /* Página #/ativos (v25) — inventário derivado, agrupado em cards de ativo com portas/

  /* Gráficos inline SVG (v25) — sem biblioteca: distribuição de severidade + cobertura por
     fase, para o sumário executivo. Um <svg> é só uma string montada no render. */
  /* fill/atributos de SVG não resolvem var() como propriedades CSS — converte o token pra
     valor concreto antes de montar o markup. */
  function resolveColor(c) {
    if (c && c.indexOf('var(') === 0 && typeof getComputedStyle === 'function') {
      var prop = c.slice(4, -1).trim();

    }
    return c || '#888888';

  function svgBarChart(items, height) {
    var max = 1;
    items.forEach(function (it) { if (it.count > max) max = it.count; });
    var barW = 52, gap = 30, base = 120, h = height || 170;
    var totalW = items.length * barW + (items.length - 1) * gap;
    var bars = items.map(function (it, i) {
      var bh = Math.max(2, Math.round((it.count / max) * 90));
      var x = i * (barW + gap), y = base - bh;
      return '<g><rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + bh + '" fill="' + resolveColor(it.color) + '" rx="3"></rect>' +
        '<text x="' + (x + barW / 2) + '" y="' + (base - bh - 8) + '" text-anchor="middle" font-size="14" font-weight="bold" fill="currentColor">' + it.count + '</text>' +
        '<text x="' + (x + barW / 2) + '" y="' + (base + 22) + '" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.65">' + escapeHTML(it.label) + '</text></g>';
    }).join('');
    return '<svg class="report-chart" width="' + totalW + '" height="' + (base + 40) + '" viewBox="0 0 ' + totalW + ' ' + (base + 40) + '" role="img">' + bars + '</svg>';
  }
  function reportChartsHTML(findings) {
    var counts = severityCounts(findings);
    var sevItems = SEVERITIES.map(function (s) { return { label: s.label, count: counts[s.id], color: s.color }; });
    var phaseCounts = {};
    findings.forEach(function (f) { if (f.phase) phaseCounts[f.phase] = (phaseCounts[f.phase] || 0) + 1; });
    var phaseItems = PHASES.filter(function (p) { return phaseCounts[p.id]; }).map(function (p) { return { label: p.label, count: phaseCounts[p.id], color: 'var(--signal)' }; });
    var out = '<div class="report-charts">' +
      '<div class="report-chart-block"><div class="report-chart-label">Achados por severidade</div>' + svgBarChart(sevItems) + '</div>';
    if (phaseItems.length) out += '<div class="report-chart-block"><div class="report-chart-label">Achados por fase</div>' + svgBarChart(phaseItems) + '</div>';

  /* Tabela de remediação (v25) — o "para fazer" do relatório: cada achado com severidade,

  function reportAnnexesHTML() {

  /* #/automacao — hub central da automação via Pi Agent (v29): faixa de controle (alvo +
     sessão + Rodar tudo/ações), faixa de resumo (progresso x/y + achados/rascunhos) e um
     grid de cards de fase (nmap → subfinder → httpx → nuclei..., a ordem de AGENT_TOOL_DEFS),
     cada card com um "Rodar fase" que executa só aquela fase. Um único gatilho "Rodar tudo"
     dispara o pipeline inteiro contra o alvo da sessão — não há mais botão por ferramenta, e
     as ferramentas NÃO aparecem dentro dos cards de módulo (scan-network/scan-web-surface).
     Não há checkbox de confirmação: o backend do agente já exige `confirm: true` em todo
     POST /jobs (ver pi-agent/agent.py) independente do que a UI mostra, então o checkbox
     era só fricção de clique sem ganho real de segurança — removido a pedido do usuário. */
  function lastScanFor(tool) {
    var scans = getEngagementState(getCurrentEngagementId()).scans;
    for (var i = scans.length - 1; i >= 0; i--) if (scans[i].tool === tool) return scans[i];
    return null;
  }
  /* Estado visual de um nó do pipeline: executando (scan ativo) > na fila (ainda não
     começou neste lote) > último resultado conhecido (concluído/falhou) > nunca rodou. */
  function agentNodeState(def) {
    if (currentScanFor(def.tool)) return 'running';
    if ((getEngagementState(getCurrentEngagementId()).agentQueue || []).indexOf(def.tool) !== -1) return 'queued';
    var last = lastScanFor(def.tool);
    if (last) return last.status === 'done' ? 'done' : (last.status === 'error' ? 'error' : 'idle');
    if (toolInstalled(def.tool) === false) return 'missing';
    return 'idle';
  }
  /* Rótulo curto pro chip (o estado idle usa um traço em vez de "aguardando" por extenso —
     era a palavra repetida em toda linha antes de qualquer scan rodar, virando ruído visual
     e forçando truncamento nos nomes `oblivion *` mais compridos; o texto completo continua
     acessível via title="" no span). */
  var AGENT_NODE_STATE_TITLE = { idle: 'aguardando', queued: 'na fila do pipeline', running: 'executando agora', done: 'concluído', error: 'falhou', missing: 'não instalado no agente' };
  /* Helpers de estado das linhas de ferramenta (v25/v29): plDur/plChip são os formatadores
     de duração e chip de status usados por pcToolRowHTML — os nomes `pl*` são históricos (da
     timeline v25), as classes emitidas agora são `.pc-*`. */
  function plDur(scan) {
    var start = scan.createdAt || scan.updatedAt, end = scan.updatedAt || Date.now();
    var s = Math.max(0, Math.round((end - start) / 1000));
    if (s < 60) return s + 's';
    return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
  }
  function plChip(cls, text) { return '<span class="pc-st st-' + cls + '">' + text + '</span>'; }
  /* Linha de ferramenta no Kanban (WS-B/C/E): dot de estado + nome + chips (duração do último
   scan / aviso de 0 achados) + picker de parâmetro inline (persistido em prefParams). */
  function kbToolHTML(def) {
    var state = agentNodeState(def);
    var dotCls = 'kb-dot' + (state === 'running' ? ' is-run' : state === 'done' ? ' is-done' : state === 'error' ? ' is-err' : state === 'queued' ? ' is-q' : state === 'missing' ? ' is-missing' : '');
    var last = lastScanFor(def.tool);
    var chips = '';
    if (last && last.status === 'done') chips += plChip('st-done', plDur(last));
    if (last && last.warning && (last.status === 'done' || last.status === 'error')) {
      chips += '<span class="kb-warn" title="' + escapeHTML(last.warning) + '">0 achados</span>';
    }
    var paramSel = '';
    if (def.paramKey && def.paramOptions && def.paramOptions.length) {
      var st2 = getEngagementState(getCurrentEngagementId());
      var cur = (st2.prefParams && st2.prefParams[def.tool] && st2.prefParams[def.tool][def.paramKey]) || def.defaultParam;
      paramSel = '<select class="kb-param" data-param-tool="' + escapeHTML(def.tool) + '" data-param-key="' + escapeHTML(def.paramKey) + '" title="' + escapeHTML(def.paramLabel || 'Parâmetro') + '">' +
        def.paramOptions.map(function (o) { return '<option value="' + escapeHTML(o.value) + '"' + (o.value === cur ? ' selected' : '') + '>' + escapeHTML(o.label) + '</option>'; }).join('') +
        '</select>';
    }
    return '<div class="kb-tool" title="' + escapeHTML(def.desc) + '">' +
      '<span class="kb-tool-top">' +
        '<span class="' + dotCls + '" title="' + escapeHTML(AGENT_NODE_STATE_TITLE[state]) + '"></span>' +
        '<span class="kb-tool-name">' + escapeHTML(def.label) + '</span>' +
        chips +
      '</span>' +
      paramSel +
    '</div>';
  }
  /* Coluna de fase no Kanban Board (v29f) — header (idx, label, ref, progress) + lista de
     ferramentas + [Rodar fase] + [Re-testar fase] (WS-C: re-testa só tools com achados). */
  function kbColHTML(p, i, tools, pipelineBusy) {
    var runnableCount = tools.filter(function (d) { return !(d.targetKind === 'repo') && toolInstalled(d.tool) !== false; }).length;
    var doneCount = tools.filter(function (d) { var s = agentNodeState(d); return s === 'done' || s === 'error'; }).length;
    var pct = runnableCount ? Math.round(doneCount / runnableCount * 100) : 0;
    var head = '<div class="kb-head">' +
      '<span class="kb-idx">' + String(i + 1).padStart(2, '0') + '</span>' +
      '<span class="kb-label">' + escapeHTML(String(p.label).toUpperCase()) + '</span>' +

  /* Busca a saída bruta (raw.*) de um job no agente (v25) — o endpoint GET /jobs/{id}/raw

  function agentFetchRaw(scanId) {
    var cfg = getAgentConfig(), st = getEngagementState(getCurrentEngagementId());
    var scan = st.scans.find(function (s) { return s.id === scanId; });
    if (!cfg.url || !scan) { showToast('Scan não encontrado neste engajamento.'); return; }
    showToast('Buscando saída bruta…');
    fetch(cfg.url + '/api/v1/jobs/' + encodeURIComponent(scan.id) + '/raw', { headers: { 'Authorization': 'Bearer ' + (cfg.token || '') } })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.blob();
      })
      .then(function (blob) {
        var def = agentToolDef(scan.tool);
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = (scan.tool || 'scan') + '-raw-' + String(scanId).slice(0, 8) + '.txt';

        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);

  function buildReportMarkdown() {

    else {
      var order = SEVERITIES.map(function (s) { return s.id; });
      findings.slice().sort(function (a, b) { return order.indexOf(a.severity) - order.indexOf(b.severity); }).forEach(function (f, i) {
        L.push('### ' + (i + 1) + '. ' + (f.title || '(sem título)'));
        L.push('');
        L.push('- **Severidade:** ' + severityMeta(f.severity).label + (f.cvss ? (function () { var s = cvssScoreFromVector(f.cvss); return ' (CVSS 3.1: ' + f.cvss + (s != null ? ' — score ' + s.toFixed(1) : '') + ')'; })() : ''));

        if (f.evidence) { L.push('**Evidência:**'); L.push(''); L.push('```'); L.push(f.evidence); L.push('```'); L.push(''); }
        if (f.recommendation) { L.push('**Recomendação:**'); L.push(''); L.push(f.recommendation); L.push(''); }

  /* Export da rodada (v24): só os scans de um mesmo batch (Rodar tudo ou Re-teste) viram um

  function downloadScansReport() {

    var batchScans = scans.filter(function (s) { return s.batchId; });
    if (!batchScans.length) { showToast('Nenhuma rodada em lote registrada ainda (rode "Rodar tudo" ou "Re-testar").'); return; }
    var latest = batchScans.reduce(function (a, b) { return (b.updatedAt || b.createdAt) > (a.updatedAt || a.createdAt) ? b : a; });
    var group = batchScans.filter(function (s) { return s.batchId === latest.batchId; }).sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
    var eng = currentEngagement();

    L.push('# Relatório da rodada — ' + (eng ? eng.name : 'Engajamento'));
    L.push('');

    L.push('- **Fim:** ' + new Date(latest.updatedAt).toLocaleString('pt-BR'));
    L.push('- **Ferramentas no lote:** ' + group.length);
    L.push('');
    L.push('| Ferramenta | Status | Achados | Resumo |');

    var byId = {};
    getFindings().forEach(function (f) { byId[f.id] = f; });
    group.forEach(function (s) {
      var def = agentToolDef(s.tool);
      var n = (s.summary && s.summary.count != null) ? s.summary.count : (s.findingIds ? s.findingIds.length : 0);
      var res = s.status === 'done' ? 'concluído' : (s.status === 'error' ? 'falhou' : s.status);
      var titles = (s.findingIds || []).map(function (id) { var f = byId[id]; return f && f.title ? f.title : ''; }).filter(function (t) { return t; }).join('; ');
      L.push('| ' + (def ? def.label : s.tool) + ' | ' + res + ' | ' + n + ' | ' + titles + ' |');
    });
    var listed = group.filter(function (s) { return s.status === 'done' && (s.findingIds || []).length; });
    if (listed.length) {
      L.push('');
      L.push('## Achados da rodada');
      L.push('');
      var seen = [];
      group.forEach(function (s) {
        (s.findingIds || []).forEach(function (id) {
          var f = byId[id];
          if (!f || seen.indexOf(id) >= 0) return; seen.push(id);
          L.push('### ' + f.title);
          L.push('');
          L.push('- **Severidade:** ' + severityMeta(f.severity).label);
          L.push('- **Status:** ' + statusMeta(f.status).label);
          if (f.cvss) { var sc = cvssScoreFromVector(f.cvss); L.push('- **CVSS:** ' + f.cvss + (sc != null ? ' (score ' + sc.toFixed(1) + ')' : '')); }
          if (f.cwe) L.push('- **CWE:** ' + f.cwe);
          if (f.affected) L.push('- **Alvo:** ' + f.affected);
          L.push('');
        });
      });
    }
    var blob = new Blob([L.join('\n')], { type: 'text/markdown' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'rodada-' + latest.batchId + '.md';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    showToast('Relatório da rodada exportado (' + group.length + ' ferramentas).');
  }

  /* ============================================================
     SEARCH
     ============================================================ */
  var searchIndex = [], searchHighlight = -1;
  function normalize(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function buildSearchIndex() {
    searchIndex = STEPS.map(function (s) {
      var c = s.content;
      var text = [s.title, s.shortDescription, c.objetivo, c.quandoExecutar, c.comoValidar].join(' ');
      (c.oQueProcurar || []).forEach(function (t) { text += ' ' + t; });
      (c.observacoes || []).forEach(function (t) { text += ' ' + t; });
      (c.comandos || []).forEach(function (cd) { text += ' ' + cd.label + ' ' + cd.command + ' ' + (cd.tool || ''); });
      (c.checklist || []).forEach(function (cd) { text += ' ' + cd.text; });
      return { kind: 'step', step: s, norm: normalize(text) };
    });
  }
  /* Achados mudam o tempo todo (ao contrário dos steps, fixos em STEPS), então o índice
     deles é montado lazy a cada busca em vez de no init. Sempre "no escopo": getFindings()
     já é do engajamento ativo. */
  function buildFindingSearchEntries() {
    return getFindings().map(function (f) {
      var text = [f.title, f.description, f.evidence, f.affected, f.cwe, f.sourceTool,
        severityMeta(f.severity).label, statusMeta(f.status).label].join(' ');
      return { kind: 'finding', finding: f, norm: normalize(text) };
    });
  }
  function searchQuery(q) {
    var nq = normalize(q).trim();
    if (!nq) return [];
    var terms = nq.split(/\s+/);
    var entries = searchIndex.concat(buildFindingSearchEntries());
    return entries.filter(function (e) { return terms.every(function (t) { return e.norm.indexOf(t) !== -1; }); }).slice(0, 30);
  }
  /* Resultados do escopo atual primeiro; os de fora continuam acessíveis, apenas marcados —
     esconder conteúdo da busca seria pior do que mostrá-lo fora de contexto. Achados contam
     como do escopo (sempre pertencem ao engajamento ativo). */
  function renderSearchResults(q) {
    var results = searchQuery(q);
    var scopeId = currentScopeId();
    var inScope = [], outScope = [];
    results.forEach(function (r) {
      if (r.kind === 'finding') { inScope.push(r); return; }
      (r.step.scopes && r.step.scopes.indexOf(scopeId) !== -1 ? inScope : outScope).push(r);
    });
    var box = document.getElementById('search-results');
    var i = 0;
    function rowHTML(r, out) {
      if (r.kind === 'finding') {
        var fm = severityMeta(r.finding.severity);
        return '<a class="search-result' + (i++ === 0 ? ' is-highlighted' : '') + '" data-search-nav href="#/achados/' + r.finding.id + '">' +
          '<div class="search-result-title">' + escapeHTML(r.finding.title || '(sem título)') + '</div>' +
          '<div class="search-result-path">achado · ' + escapeHTML(fm.label) + (r.finding.affected ? ' · ' + escapeHTML(r.finding.affected) : '') + '</div></a>';
      }
      var phase = PHASES.find(function (p) { return p.id === r.step.phase; });
      var html = '<a class="search-result' + (i === 0 ? ' is-highlighted' : '') + (out ? ' is-out-of-scope' : '') + '" data-search-nav href="#/etapa/' + r.step.phase + '/' + r.step.id + '">' +
        '<div class="search-result-title">' + escapeHTML(r.step.title) + '</div>' +
        '<div class="search-result-path">' + escapeHTML(phase ? phase.label : '') + ' · ' + escapeHTML(DOMAIN_LABELS[r.step.domain] || r.step.domain) +
        (out ? ' · fora do escopo atual' : '') + '</div></a>';
      i++;
      return html;
    }
    var html = inScope.map(function (r) { return rowHTML(r, false); }).join('');
    if (outScope.length) {
      html += '<div class="search-divider">Outros escopos</div>' + outScope.map(function (r) { return rowHTML(r, true); }).join('');
    }
    searchHighlight = results.length ? 0 : -1;
    box.innerHTML = html || (q.trim() ? '<div class="empty-state">Nada encontrado.</div>' : '');
  }
  function moveSearchHighlight(delta) {
    var results = document.querySelectorAll('.search-result');
    if (!results.length) return;
    if (results[searchHighlight]) results[searchHighlight].classList.remove('is-highlighted');
    searchHighlight = (searchHighlight + delta + results.length) % results.length;
    results[searchHighlight].classList.add('is-highlighted');
    results[searchHighlight].scrollIntoView({ block: 'nearest' });
  }

  function copyText(text, btn) {
    function done() { var orig = btn.textContent; btn.textContent = 'Copiado!'; setTimeout(function () { btn.textContent = orig; }, 1400); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text); done(); });
    else { fallbackCopy(text); done(); }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);

  /* Watchdog de localStorage (v23): o teto real (~5MB) é alcançável num engajamento longo
     com achados de evidência grande + histórico de scans. Medida aproximada: cada caractere
     em UTF-16 ocupa 2 bytes. Exibida no modal de engajamento e avisada por toast no load. */
  var STORAGE_QUOTA_BYTES = 5 * 1024 * 1024;
  function storageUsage() {
    var total = 0;
    [LS_ENGAGEMENTS, LS_CURRENT, LS_AGENT, LS_STATE].forEach(function (k) {
      try { var v = localStorage.getItem(k); if (v) total += v.length * 2; } catch (e) {}
    });
    return total;
  }
  function storageUsagePct() { return Math.min(100, Math.round((storageUsage() / STORAGE_QUOTA_BYTES) * 100)); }
  function storageUsageLabel() {

  function importData(file) {

      try {

        if (data.state) saveJSON(LS_STATE, data.state);
        if (data.currentEngagementId) setCurrentEngagementId(data.currentEngagementId);

  function closeSidebar() { document.getElementById('sidebar').classList.remove('is-open'); document.getElementById('sidebar-overlay').hidden = true; }
  function openSearch() { showModal(document.getElementById('search-modal')); document.getElementById('search-input').value = ''; renderSearchResults(''); setTimeout(function () { document.getElementById('search-input').focus(); }, 30); }
  function closeSearch() { hideModal(document.getElementById('search-modal')); }
  function openEngagementModal() { renderEngagementModal(); showModal(document.getElementById('engagement-modal')); }
  function closeEngagementModal() { hideModal(document.getElementById('engagement-modal')); }
  /* Trocar escopo reconfigura a trilha inteira; o progresso NÃO é apagado — o checklist de
     um step fora do novo escopo apenas deixa de ser contado e volta se o escopo voltar. */
  function requestScopeChange() {
    if (!currentScopeId()) { navigate('#/escopo'); return; }
    confirmDialog({
      title: 'Trocar escopo?',
      message: 'Trocar o escopo reconfigura as etapas deste engajamento — módulos, variáveis de sessão e cálculo de progresso mudam para o novo escopo. Seu progresso, notas e achados são preservados e voltam a contar se você voltar ao escopo atual.',
      confirmLabel: 'Trocar escopo',
      onConfirm: function () { navigate('#/escopo'); }
    });
  }

  function init() {
    content = document.getElementById('content');
    var varsBar = document.getElementById('vars-bar');

    document.getElementById('phase-nav').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-phase-nav]');
      if (btn) { navigate('#/etapa/' + btn.getAttribute('data-phase-nav')); if (window.innerWidth <= 900) closeSidebar(); return; }
      if (e.target.closest('.phase-nav-sub') && window.innerWidth <= 900) closeSidebar(); /* deixa o <a> navegar */
    });
    document.getElementById('scope-mini').addEventListener('click', requestScopeChange);
    /* v16: a nav global (topo) e o link de Referência (rodapé) ficam fora de #phase-nav,
       então precisam do próprio fechamento em mobile — sem isso, tocar "Início"/"Relatório"
       no celular navegava mas deixava a sidebar aberta por cima do conteúdo. */
    document.getElementById('sidebar').addEventListener('click', function (e) {
      if (window.innerWidth > 900) return;
      if (e.target.closest('#sidebar-nav a') || e.target.closest('.util-link-ref') || e.target.closest('.brand') || e.target.closest('#scope-mini')) closeSidebar();
    });
    varsBar.addEventListener('input', function (e) {
      var key = e.target.getAttribute('data-var');
      if (!key) return;
      setVar(key, e.target.value);
      var cell = e.target.closest('.var-cell');
      if (cell) cell.classList.toggle('is-filled', !!e.target.value);
      updateAllCommandOutputs();
      var setupInput = content.querySelector('[data-var="' + key + '"]');
      if (setupInput) setupInput.value = e.target.value;
      syncSetupValidity();
    });
    varsBar.addEventListener('click', function (e) {
      if (e.target.closest('#search-trigger-btn')) { openSearch(); return; }
      if (e.target.closest('[data-vars-toggle]')) { sessionBarExpanded = !sessionBarExpanded; renderVarsBar(); return; }
    });

    content.addEventListener('click', function (e) {
      var scopePick = e.target.closest('[data-scope-pick]');
      if (scopePick) {
        setEngagementScope(getCurrentEngagementId(), scopePick.getAttribute('data-scope-pick'));
        navigate('#/etapa/setup');
        showToast('Escopo definido: ' + getScope(currentScopeId()).label);
        return;
      }
      if (e.target.closest('[data-scope-change]')) { requestScopeChange(); return; }
      var wizBtn = e.target.closest('[data-wizard-nav]');
      if (wizBtn) { navigate('#/etapa/' + wizBtn.getAttribute('data-wizard-nav')); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      if (e.target.closest('[data-wizard-finish]')) { navigate('#/resumo'); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      var domainBtn = e.target.closest('[data-domain-filter]');
      if (domainBtn) { var r = resolveRoute(); domainFilterByPhase[r.id] = domainBtn.getAttribute('data-domain-filter'); renderPhasePage(r.id); return; }
      var detailsToggle = e.target.closest('[data-details-toggle]');
      if (detailsToggle) { var sid = detailsToggle.getAttribute('data-details-toggle'); expandedSteps[sid] = !expandedSteps[sid]; renderPhasePage(resolveRoute().id); return; }
      if (e.target.closest('[data-hide-completed]')) { hideCompleted = !hideCompleted; renderPhasePage(resolveRoute().id); return; }
      if (e.target.closest('[data-hide-drafts]')) { hideDrafts = !hideDrafts; renderPentestAutomatizado(); return; }
      var sevFilterBtn = e.target.closest('[data-sev-filter]');
      if (sevFilterBtn) { var sfId = sevFilterBtn.getAttribute('data-sev-filter'); achadosSevFilter = achadosSevFilter === sfId ? null : sfId; renderPentestAutomatizado(); return; }
      if (e.target.closest('[data-agent-configure]')) { openEngagementModal(); return; }
      if (e.target.closest('[data-agent-run-all]')) { agentRunAll(); return; }
      if (e.target.closest('[data-agent-run-phase]')) { agentRunPhase(e.target.closest('[data-agent-run-phase]').getAttribute('data-agent-run-phase')); return; }
      if (e.target.closest('[data-agent-retest-phase]')) { agentRetestPhase(e.target.closest('[data-agent-retest-phase]').getAttribute('data-agent-retest-phase')); return; }
      if (e.target.closest('[data-agent-stop]')) { agentStopAll(); return; }
      if (e.target.closest('[data-agent-retest]')) { agentRetestOpen(); return; }
      if (e.target.closest('[data-scans-report]')) { downloadScansReport(); return; }
      var eviToggle = e.target.closest('[data-evi-toggle]');
      if (eviToggle) { var ek = eviToggle.getAttribute('data-evi-toggle'); evidenceOpen[ek] = !evidenceOpen[ek]; renderPhasePage(resolveRoute().id); return; }
      var checkEl = e.target.closest('[data-check-step]');
      if (checkEl) {
        toggleChecklistItem(checkEl.getAttribute('data-check-step'), checkEl.getAttribute('data-check-item'));
        var r3 = resolveRoute();
        renderStepper(r3); updateEngagementMini(); renderPhasePage(r3.id);
        return;
      }
      var copyBtn = e.target.closest('.copy-btn');
      if (copyBtn) { var t = document.getElementById(copyBtn.getAttribute('data-copy-target')); if (t) copyText(t.textContent, copyBtn); return; }
      var addFind = e.target.closest('[data-add-finding]');
      if (addFind) {
        var s = STEPS.find(function (x) { return x.id === addFind.getAttribute('data-add-finding'); }) || {};
        var nid = addFinding({ stepId: s.id || '', phase: s.phase || '', domain: s.domain || '' });
        expandedFindings[nid] = true; editingFindings[nid] = true; /* achado novo abre já em edição (v12) */
        navigate('#/achados/' + nid);
        return;
      }
      if (e.target.closest('[data-finding-new]')) { var newId = addFinding({}); expandedFindings[newId] = true; editingFindings[newId] = true; navigate('#/achados/' + newId); return; }
      var delFind = e.target.closest('[data-finding-del]');
      if (delFind) {
        var delFindId = delFind.getAttribute('data-finding-del');
        confirmDialog({ title: 'Excluir achado?', message: 'Essa ação não pode ser desfeita.', confirmLabel: 'Excluir', danger: true,
          onConfirm: function () { deleteFinding(delFindId); renderPentestAutomatizado(); } });
        return;
      }
      if (e.target.closest('[data-finding-del-all]')) {
        var totalToDelete = getFindings().length;
        confirmDialog({ title: 'Excluir todos os achados?', message: 'Isso apaga os ' + totalToDelete + ' achado(s) deste engajamento — manuais e vindos da automação, incluindo rascunhos. Essa ação não pode ser desfeita.', confirmLabel: 'Excluir todos', danger: true,
          onConfirm: function () { deleteAllFindings(); renderPentestAutomatizado(); showToast('Todos os achados foram excluídos.'); } });
        return;
      }
      /* v23: promover rascunhos em lote — saída do pipeline revisada vira achado real de uma
         vez. Sem confirmação pra N=1 (clique já é a intenção), com confirmDialog quando há
         vários, igual aos outros destrutivos/mutuadores do app. */
      if (e.target.closest('[data-promote-drafts]')) {
        var drafts = getFindings().filter(function (f) { return f.status === 'rascunho'; });
        var promote = function () {
          drafts.forEach(function (f) { updateFinding(f.id, { status: 'aberto' }); });
          renderPentestAutomatizado();
          showToast(drafts.length + ' rascunho(s) promovido(s) a "aberto".');
        };
        if (drafts.length > 1) {
          confirmDialog({ title: 'Promover ' + drafts.length + ' rascunhos?', message: 'Os achados vindos do pipeline passam de "rascunho" para "aberto" e passam a contar no relatório. Você ainda pode editá-los depois.', confirmLabel: 'Promover', danger: false, onConfirm: promote });
        } else { promote(); }
        return;
      }
      /* WS-F: triagem em lote — checkbox liga/desliga a seleção; as ações aplicam na seleção */
      var triBox = e.target.closest('[data-triage]');
      if (triBox) {
        var triId = triBox.getAttribute('data-triage');
        var triInp = triBox.querySelector('input');
        if (triId) { triageSel[triId] = !!(triInp && triInp.checked); if (!triageSel[triId]) delete triageSel[triId]; }
        renderPentestAutomatizado(); return;
      }
      if (e.target.closest('[data-triage-clear]')) { triageSel = {}; renderPentestAutomatizado(); return; }
      var triAction = e.target.closest('[data-triage-action]');
      if (triAction) {
        var selIds = getFindings().filter(function (f) { return triageSel[f.id]; }).map(function (f) { return f.id; });
        var act = triAction.getAttribute('data-triage-action');
        if (!selIds.length) { showToast('Nada selecionado.'); return; }
        if (act === 'promote') {
          selIds.forEach(function (id) { updateFinding(id, { status: 'aberto' }); });
          triageSel = {};
          renderPentestAutomatizado();
          showToast(selIds.length + ' achado(s) promovido(s) a "aberto".');
        } else if (act === 'fp') {
          selIds.forEach(function (id) { updateFinding(id, { status: 'falso-positivo' }); });
          triageSel = {};
          renderPentestAutomatizado();
          showToast(selIds.length + ' achado(s) marcado(s) como falso positivo.');
        } else if (act === 'del') {
          confirmDialog({ title: 'Excluir ' + selIds.length + ' achado(s)?', message: 'A ação não pode ser desfeita.', confirmLabel: 'Excluir', danger: true,
            onConfirm: function () { selIds.forEach(deleteFinding); triageSel = {}; renderPentestAutomatizado(); showToast(selIds.length + ' achado(s) excluído(s).'); } });
        }
        return;
      }
      var nextDraft = e.target.closest('[data-next-draft]');
      if (nextDraft) {
        var nid = nextDraftId(nextDraft.getAttribute('data-next-draft'));
        if (!nid) { showToast('Não há próximo rascunho.'); return; }
        expandedFindings[nid] = true; editingFindings[nid] = false;
        navigate('#/achados/' + nid);
        return;
      }
      var editFind = e.target.closest('[data-finding-edit]');
      if (editFind) { var efid = editFind.getAttribute('data-finding-edit'); editingFindings[efid] = !editingFindings[efid]; renderPentestAutomatizado(); return; }
      var findToggle = e.target.closest('[data-finding-toggle]');
      if (findToggle) { expandedFindings[findToggle.getAttribute('data-finding-toggle')] = findToggle.getAttribute('aria-expanded') !== 'true'; renderPentestAutomatizado(); return; }
      if (e.target.closest('[data-report-md]')) { downloadReportMarkdown(); return; }
      if (e.target.closest('[data-report-word]')) { downloadReportWord(); return; }
      if (e.target.closest('[data-report-print]')) { window.print(); return; }
      /* Fase B — filtro por ativo (da página #/ativos ou do chip de limpeza) */
      var ativoBtn = e.target.closest('[data-ativo-findings]');
      if (ativoBtn) {
        activeAsset = ativoBtn.getAttribute('data-ativo-findings');
        location.hash = '#/achados';
        return;
      }
      if (e.target.closest('[data-ativo-clear]')) { activeAsset = null; renderPentestAutomatizado(); return; }
      /* v25 — baixar a saída bruta de um scan do histórico */
      var rawBtn = e.target.closest('[data-scan-raw]');
      if (rawBtn) { agentFetchRaw(rawBtn.getAttribute('data-scan-raw')); return; }
      /* Fase A — mescla de achados correlacionados */
      var mergeBtn = e.target.closest('[data-finding-merge]');
      if (mergeBtn) {
        var ids = mergeBtn.getAttribute('data-finding-merge').split(',');
        if (ids.length < 2) { showToast('Selecione pelo menos dois achados para mesclar.'); return; }
        confirmDialog({
          title: 'Mesclar ' + ids.length + ' achados?',
          message: 'Será mantido o de maior severidade; descrição, evidência, recomendação e itens serão concatenados, e o ativo/sourceTool unificados. Os achados mesclados são removidos da lista.',
          confirmLabel: 'Mesclar', danger: false,
          onConfirm: function () { mergeFindings(ids); renderPentestAutomatizado(); showToast('Achados mesclados.'); }
        });
        return;
      }
    });
    /* Setup e vars gravam direto e NUNCA chamam render() — um re-render recriaria os
       <input>/<textarea> e derrubaria o foco no meio da digitação. */
    content.addEventListener('input', function (e) {
      if (e.target.hasAttribute('data-session')) { setSessionHeader(e.target.value); return; }
      var varKey = e.target.getAttribute('data-var');
      if (varKey) {
        setVar(varKey, e.target.value);
        updateAllCommandOutputs();
        syncSetupValidity();
        var barInput = document.querySelector('#vars-bar [data-var="' + varKey + '"]');
        if (barInput && barInput !== e.target) {
          barInput.value = e.target.value;
          barInput.closest('.var-cell').classList.toggle('is-filled', !!e.target.value);
        }
        return;
      }
      var setupKey = e.target.getAttribute('data-setup');
      if (setupKey) { setSetupField(setupKey, e.target.value); return; }
      /* campos de texto de achados: grava sem render p/ não perder o foco */
      var fId = e.target.getAttribute('data-finding');
      if (fId && e.target.tagName !== 'SELECT') {
        var patch = {}; patch[e.target.getAttribute('data-field')] = e.target.value; updateFinding(fId, patch);
        return;
      }
    });
    /* selects de achados (severidade/status) re-renderizam a tela p/ atualizar chip/cor */
    content.addEventListener('change', function (e) {
      var delaySel = e.target.getAttribute('data-agent-delay');
      if (delaySel) { setAgentField('delayMs', (parseInt(e.target.value, 10) || 0) * 1000); showToast('Polidez ajustada: ' + (parseInt(e.target.value, 10) || 0) + 's entre ferramentas.'); return; }
      /* WS-C: picker de parâmetro por ferramenta (Kanban) — persiste em prefParams */
      var paramTool = e.target.getAttribute('data-param-tool');
      if (paramTool !== null) {
        var pKey = e.target.getAttribute('data-param-key'), pVal = e.target.value;
        var stP = getEngagementState(getCurrentEngagementId());
        if (!stP.prefParams) stP.prefParams = {};
        if (!stP.prefParams[paramTool]) stP.prefParams[paramTool] = {};
        stP.prefParams[paramTool][pKey] = pVal;
        saveEngagementState(getCurrentEngagementId(), stP);
        return;
      }
      var fId = e.target.getAttribute('data-finding');
      if (fId && e.target.tagName === 'SELECT') {
        var patch = {}; patch[e.target.getAttribute('data-field')] = e.target.value; updateFinding(fId, patch);
        renderPentestAutomatizado();
      }
    });
    var notesDebounce = null, eviDebounce = null;
    content.addEventListener('input', function (e) {
      var eviStep = e.target.getAttribute('data-evidence-step');
      if (eviStep) {
        var eviItem = e.target.getAttribute('data-evidence-item'), eviVal = e.target.value;
        clearTimeout(eviDebounce);
        eviDebounce = setTimeout(function () { setEvidence(eviStep, eviItem, eviVal); }, 400);
        return;
      }
      var stepId = e.target.getAttribute('data-notes-step');
      if (!stepId) return;
      var val = e.target.value;
      clearTimeout(notesDebounce);
      notesDebounce = setTimeout(function () {
        saveNote(stepId, val);
        var status = document.querySelector('[data-notes-status="' + stepId + '"]');
        if (status) status.textContent = 'Salvo às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      }, 400);
    });

    document.getElementById('sidebar-toggle').addEventListener('click', openSidebar);
    document.getElementById('sidebar-overlay').addEventListener('click', closeSidebar);
    document.getElementById('search-modal').addEventListener('click', function (e) { if (e.target.id === 'search-modal') closeSearch(); });
    document.getElementById('search-input').addEventListener('input', function (e) { renderSearchResults(e.target.value); });
    document.getElementById('search-results').addEventListener('click', function (e) { if (e.target.closest('[data-search-nav]')) closeSearch(); });
    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); return; }
      if (e.key === 'Escape') { closeSearch(); closeEngagementModal(); closeConfirm(); return; }
      /* Kanban: setas esquerda/direita navegam o scroll horizontal quando o modal de busca não está aberto */
      var sm = document.getElementById('search-modal');
      if (sm.hidden && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        var grid = document.querySelector('.kb-grid');
        if (grid) {
          e.preventDefault();
          var col = document.querySelector('.kb-col');
          if (col) {
            var step = col.offsetWidth + 12; /* largura + gap */
            grid.scrollBy({ left: e.key === 'ArrowLeft' ? -step : step, behavior: 'smooth' });
          }
        }
      }
      var sm = document.getElementById('search-modal');
      if (!sm.hidden) {
        if (e.key === 'ArrowDown') { e.preventDefault(); moveSearchHighlight(1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); moveSearchHighlight(-1); }
        else if (e.key === 'Enter') { var el = document.querySelectorAll('.search-result')[searchHighlight]; if (el) el.click(); }
      }
    });

    document.getElementById('confirm-modal').addEventListener('click', function (e) {
      if (e.target.id === 'confirm-modal' || e.target.closest('[data-confirm-cancel]')) { closeConfirm(); return; }
      if (e.target.closest('[data-confirm-ok]')) { var cb = confirmCallback; closeConfirm(); if (cb) cb(); }
    });

    document.getElementById('engagement-mini-btn').addEventListener('click', openEngagementModal);
    document.getElementById('engagement-modal-close').addEventListener('click', closeEngagementModal);
    document.getElementById('engagement-modal').addEventListener('click', function (e) { if (e.target.id === 'engagement-modal') closeEngagementModal(); });
    document.getElementById('engagement-modal-body').addEventListener('click', function (e) {
      var sw = e.target.closest('[data-eng-switch]');
      if (sw) {
        var eid = sw.getAttribute('data-eng-switch');
        setCurrentEngagementId(eid);
        closeEngagementModal();
        var eng = getEngagements().find(function (x) { return x.id === eid; });
        navigate('#/'); /* resolveRoute leva pro lugar certo do novo engajamento (escopo/setup/1ª fase) */
        showToast('Engajamento ativo: ' + (eng ? eng.name : ''));
        return;
      }
      var ren = e.target.closest('[data-eng-rename]');
      if (ren) {
        var id = ren.getAttribute('data-eng-rename'); var cur = getEngagements().find(function (x) { return x.id === id; });
        var name = prompt('Novo nome:', cur ? cur.name : '');
        if (name && engagementNameTaken(name, id) && !confirm('Já existe um engajamento chamado "' + name.trim() + '" — os dois vão ficar com o mesmo nome na lista. Renomear mesmo assim?')) return;
        if (name) { renameEngagement(id, name); renderEngagementModal(); render(); }
        return;
      }
      var del = e.target.closest('[data-eng-delete]');
      if (del) {
        var did = del.getAttribute('data-eng-delete');
        var delEng = getEngagements().find(function (x) { return x.id === did; });
        confirmDialog({ title: 'Excluir engajamento?', message: 'Excluir "' + (delEng ? delEng.name : '') + '" apaga todo o progresso, notas, variáveis e achados associados. Essa ação não pode ser desfeita.', confirmLabel: 'Excluir engajamento', danger: true,
          onConfirm: function () { deleteEngagement(did); renderEngagementModal(); render(); } });
        return;
      }
      if (e.target.id === 'new-eng-create') {
        var nameInput = document.getElementById('new-eng-name');
        var newName = nameInput.value.trim();
        if (!newName) { nameInput.focus(); return; }
        if (engagementNameTaken(newName, null) && !confirm('Já existe um engajamento chamado "' + newName + '" — os dois vão ficar com o mesmo nome na lista. Criar mesmo assim?')) return;
        var newId = createEngagement(newName, document.getElementById('new-eng-scope').value, document.getElementById('new-eng-client').value.trim());
        setCurrentEngagementId(newId); closeEngagementModal(); navigate('#/etapa/setup'); render(); showToast('Engajamento criado.');
        return;
      }
      if (e.target.id === 'eng-export') { exportData(); return; }
      if (e.target.id === 'eng-import-trigger') { document.getElementById('eng-import-file').click(); return; }
    });
    document.getElementById('engagement-modal-body').addEventListener('change', function (e) { if (e.target.id === 'eng-import-file' && e.target.files[0]) importData(e.target.files[0]); });
    document.getElementById('engagement-modal-body').addEventListener('input', function (e) {
      var agentKey = e.target.getAttribute('data-agent');
      if (agentKey) { setAgentField(agentKey, e.target.value); refreshAgentHealth(); }
    });

    document.getElementById('agent-job-badge').addEventListener('click', function () { navigate('#/pentest-automatizado'); });

    ensureAgentConfig();
    refreshAgentHealth();
    buildSearchIndex();
    window.__render = render;
    render();
    updateAgentBadge();
    if (storageUsagePct() >= 80) showToast('Armazenamento local em ' + storageUsagePct() + '% — exporte um backup no modal de engajamento.');
    setInterval(function () { agentPollTick(); updateAgentBadge(); }, 5000);
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
